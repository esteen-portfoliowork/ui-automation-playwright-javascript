name: 🎭 Playwright Validation

run-name: >
  ${{
    github.event_name == 'workflow_dispatch'
    && format('🎭 Manual Validation | {0} | {1}', github.event.inputs.environment, github.event.inputs.browser)
    || github.event_name == 'pull_request'
    && format('✅ PR #{0} | {1}', github.event.pull_request.number, github.head_ref)
    || format('✅ Push Validation #{0}', github.run_number)
  }}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  TEST_ENV: ${{ github.event.inputs.environment || 'qa' }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # Manual Trigger
  workflow_dispatch:
    inputs:
      browser:
        description: "🌐 Browser"
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      folder:
        description: "📁 Test Folder"
        required: true
        default: tests
        type: choice
        options:
          - tests

      tag:
        description: "🏷️ Test Tag Filter"
        required: false
        default: "@e2e"
        type: choice
        options:
          - "@all"
          - "@smoke"
          - "@regression"
          - "@e2e"
          - "@authentication"
          - "@inventory"
          - "@filter"
          - "@positive"
          - "@negative"

      environment:
        description: "🌍 Environment"
        required: true
        default: qa
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

      execution_mode:
        description: "🖥️ Execution Mode"
        required: true
        default: headless
        type: choice
        options:
          - headless
          - headed

      retries:
        description: "🔄 Retry Count"
        required: true
        default: "1"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"

      workers:
        description: "⚡ Parallel Workers"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "8"

      publish_report:
        description: "📢 Publish Report"
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📋 Execution Configuration
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "🌐 Browser            : ${{ inputs.browser }}"
          echo "📁 Folder             : ${{ inputs.folder }}"
          echo "🏷️ Tag                : ${{ inputs.tag }}"
          echo "🌍 Environment        : ${{ inputs.environment }}"
          echo "🖥️ Execution Mode     : ${{ inputs.execution_mode }}"
          echo "🔄 Retries            : ${{ inputs.retries }}"
          echo "⚡ Workers            : ${{ inputs.workers }}"
          echo "📢 Publish Report     : ${{ inputs.publish_report }}"

      - name: 💻 Get Runner OS
        run: |
          echo "RUNNER_OS_NAME=$RUNNER_OS" >> $GITHUB_ENV

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Get Node Version
        run: |
          echo "NODE_VERSION=$(node -v)" >> $GITHUB_ENV

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Get Playwright Version
        run: |
          PLAYWRIGHT_VERSION=$(npx playwright --version | awk '{print $2}')
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      # # Get details of run
      # - name: 🔍 Debug Inputs
      #   run: |
      #     echo "Event: ${{ github.event_name }}"
      #     echo "Browser: ${{ github.event.inputs.browser }}"
      #     echo "Folder: ${{ github.event.inputs.folder }}"
      #     echo "Environment: ${{ github.event.inputs.environment }}"

      - name: ⏱️ Capture Start Details
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "START_DATE=$(date)" >> $GITHUB_ENV

      - name: 🧪 Execute Playwright Tests
        run: |
          CMD="npx playwright test"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            CMD="$CMD ${{ inputs.folder }}"

            if [ "${{ inputs.tag }}" != "@all" ]; then
              CMD="$CMD --grep '${{ inputs.tag }}'"
            fi

            CMD="$CMD --project=${{ inputs.browser }}"
            CMD="$CMD --workers=${{ inputs.workers }}"
            CMD="$CMD --retries=${{ inputs.retries }}"

            if [ "${{ inputs.execution_mode }}" = "headed" ]; then
              CMD="$CMD --headed"
            fi

          elif [ "${{ github.event_name }}" = "pull_request" ]; then

            CMD="$CMD --project=chromium"

          fi

          echo "Executing command:"
          echo "$CMD"
          eval "$CMD"
        continue-on-error: true

      - name: ⏱️ Capture End Details
        if: always()
        run: |
          END_TIME=$(date +%s)

          echo "END_DATE=$(date)" >> $GITHUB_ENV

          DURATION=$((END_TIME - START_TIME))

          echo "EXECUTION_DURATION=${DURATION}s" >> $GITHUB_ENV

      - name: 📊 Extract Test Statistics
        if: always()
        run: |
          if [ -f "playwright-report/results.json" ]; then

            PASSED=$(jq '[.suites[].suites[].specs[] | select(.ok == true)] | length' playwright-report/results.json)
            FAILED=$(jq '[.. | objects | select(has("status")) | select(.status=="unexpected")] | length' playwright-report/results.json)
            FLAKY=$(jq '[.. | objects | select(has("status")) | select(.status=="flaky")] | length' playwright-report/results.json)
            SKIPPED=$(jq '[.. | objects | select(has("status")) | select(.status=="skipped")] | length' playwright-report/results.json)
            TOTAL=$((PASSED + FAILED + FLAKY + SKIPPED))

          else

            PASSED=0
            FAILED=0
            FLAKY=0
            SKIPPED=0
            TOTAL=0

          fi

          if [ "$TOTAL" -gt 0 ]; then
            PASS_RATE=$(awk "BEGIN { printf \"%.2f\", ($PASSED/$TOTAL)*100 }")
            FAILURE_RATE=$(awk "BEGIN { printf \"%.2f\", ($FAILED/$TOTAL)*100 }")
            FLAKY_RATE=$(awk "BEGIN { printf \"%.2f\", ($FLAKY/$TOTAL)*100 }")
          else
            PASS_RATE=0
            FAILURE_RATE=0
            FLAKY_RATE=0
          fi

          echo "PASSED_TESTS=$PASSED" >> $GITHUB_ENV
          echo "FAILED_TESTS=$FAILED" >> $GITHUB_ENV
          echo "SKIPPED_TESTS=$SKIPPED" >> $GITHUB_ENV
          echo "FLAKY_TESTS=$FLAKY" >> $GITHUB_ENV
          echo "TOTAL_TESTS=$TOTAL" >> $GITHUB_ENV

          echo "PASS_RATE=$PASS_RATE" >> $GITHUB_ENV
          echo "FAILURE_RATE=$FAILURE_RATE" >> $GITHUB_ENV
          echo "FLAKY_RATE=$FLAKY_RATE" >> $GITHUB_ENV

          if [ "$TOTAL" -gt 0 ]; then
            QUALITY_SCORE=$(awk "BEGIN { printf \"%.0f\", (($PASSED + ($FLAKY*0.5))/$TOTAL)*100 }")
          else
            QUALITY_SCORE=0
          fi

          echo "QUALITY_SCORE=$QUALITY_SCORE" >> $GITHUB_ENV

          # echo "" > module-breakdown.md

          # if [ -f "playwright-report/results.json" ]; then

          #   echo "| Application | Module | Passed | Failed |" >> module-breakdown.md
          #   echo "|-------------|--------|--------|--------|" >> module-breakdown.md

          #   echo "| Application | Passed | Failed |" > application-summary.md
          #   echo "|-------------|--------|--------|" >> application-summary.md

          # fi

      - name: 🔍 Debug Actual Test Statuses
        if: always()
        run: |
          jq '
            .suites[]
            | ..
            | objects
            | select(has("file"))
          ' playwright-report/results.json | head -300

      # Remove once fixed
      - name: 🔍 Debug Specs
        if: always()
        run: |
          jq '
            .suites[].suites[]
            | {
                file,
                specs
              }
          ' playwright-report/results.json

      # - name: 🔍 Debug Playwright Structure
        # if: always()
        # run: |
        #   jq '
        #     ..
        #     | objects
        #     | select(has("file"))
        #     | {file,title,status}
        #   ' playwright-report/results.json | head -100

      - name: 📋 Collect PR Details
        if: github.event_name == 'pull_request'
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "PR_TITLE=${{ github.event.pull_request.title }}" >> $GITHUB_ENV
          echo "PR_AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_ENV
          echo "PR_URL=${{ github.event.pull_request.html_url }}" >> $GITHUB_ENV

      # - name: 🔍 Debug Playwright Report
      #   if: always()
      #   run: |
      #     echo "Checking report..."

      #     ls -R playwright-report || true

      #     if [ -f playwright-report/results.json ]; then
      #       echo "results.json exists"

      #       echo "===== FIRST 100 LINES ====="
      #       head -100 playwright-report/results.json

      #       echo "===== TEST STATUS ENTRIES ====="
      #       jq '.. | .status? // empty' playwright-report/results.json
            
      #     else
      #       echo "results.json NOT FOUND"
      #     fi

      # - name: 🔍 Find Outcome Structure
      #   if: always()
      #   run: |
      #     echo "===== SEARCH outcome ====="
      #     grep -n "outcome" playwright-report/results.json | head -20

      #     echo "===== SEARCH status ====="
      #     grep -n "status" playwright-report/results.json | head -20

      #     echo "===== SEARCH title ====="
      #     grep -n "title" playwright-report/results.json | head -20

      # - name: 🔍 Inspect Test Node
      #   if: always()
      #   run: |
      #     jq '
      #       ..
      #       | objects
      #       | select(has("title"))
      #       | {title,status,outcome}
      #     ' playwright-report/results.json | head -200

      # - name: 📦 Build Module Breakdown
      #   if: always()
      #   run: |

      #     echo "| Application | Module | Passed | Failed |" > module-breakdown.md
      #     echo "|-------------|--------|--------|--------|" >> module-breakdown.md

      #     echo "| Application | Passed | Failed |" > app-summary.md
      #     echo "|-------------|--------|--------|" >> app-summary.md

      #     jq -r '
      #       ..
      #       | objects
      #       | select(has("file"))
      #       | [.file, .status]
      #       | @tsv
      #     ' playwright-report/results.json > test-data.tsv

      #     while IFS=$'\t' read -r FILE STATUS
      #     do

      #       APP=$(echo "$FILE" | cut -d'/' -f2)
      #       MODULE=$(echo "$FILE" | cut -d'/' -f3)

      #       echo "$APP|$MODULE|$STATUS"

      #     done < test-data.tsv

      - name: 📦 Generate Breakdown Data
        if: always()
        run: |
          echo "| Application | Module | ✅ Passed | ❌ Failed |" > module-breakdown.md
          echo "|-------------|--------|-----------|-----------|" >> module-breakdown.md

          jq -r '.suites[].suites[] | select(.file != null) | [
            .file,
            ([.specs[] | select(.ok == true)] | length),
            ([.specs[] | select(.ok == false)] | length)
          ] | @tsv' playwright-report/results.json | while IFS=$'\t' read -r FILE PASSED FAILED
          do

            APP=$(echo "$FILE" | cut -d'/' -f1)
            MODULE=$(basename "$FILE" .spec.js)

            case "$APP" in
              sauce-demo)
                APP_NAME="SauceDemo"
                ;;
              orangehr)
                APP_NAME="OrangeHR"
                ;;
              qa-playground)
                APP_NAME="QA Playground"
                ;;
              *)
                APP_NAME="$APP"
                ;;
            esac

            MODULE_NAME=$(echo "$MODULE" | sed 's/-/ /g')

            echo "| $APP_NAME | $MODULE_NAME | $PASSED | $FAILED |" >> module-breakdown.md

          done

          echo "| Application | ✅ Passed | ❌ Failed |" > application-summary.md
          echo "|-------------|-----------|-----------|" >> application-summary.md

          jq -r '.suites[].suites[] | select(.file != null) | [
            (.file | split("/")[0]),
            ([.specs[] | select(.ok == true)] | length),
            ([.specs[] | select(.ok == false)] | length)
          ]
          | @tsv
          ' playwright-report/results.json |
          awk -F'\t' '
          {
            passed[$1]+=$2;
            failed[$1]+=$3;
          }
          END{
            for(app in passed)
              print app "\t" passed[app] "\t" failed[app];
          }' |
          while IFS=$'\t' read -r APP PASSED FAILED
          do

            case "$APP" in
              sauce-demo)
                APP_NAME="SauceDemo"
                ;;
              orangehr)
                APP_NAME="OrangeHR"
                ;;
              qa-playground)
                APP_NAME="QA Playground"
                ;;
              *)
                APP_NAME="$APP"
                ;;
            esac

            echo "| $APP_NAME | $PASSED | $FAILED |" >> application-summary.md

          done

      - name: 📋 Generate Execution Summary
        if: always()
        run: |
          echo "# 🎭 Playwright Execution Summary" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$FAILED_TESTS" -eq 0 ]; then
            echo "## ✅ Build Status: PASSED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**${PASSED_TESTS}/${TOTAL_TESTS} tests passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Build Status: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Executed ${{ env.TOTAL_TESTS }} automated tests with a pass rate of ${{ env.PASS_RATE }}% in ${{ env.EXECUTION_DURATION }}." >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BROWSER="chromium"
          else
            BROWSER="${{ github.event.inputs.browser || 'all' }}"
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ENVIRONMENT="N/A"
          else
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 🔖 Pull Request Details" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| PR Number | #${{ env.PR_NUMBER }} |" >> $GITHUB_STEP_SUMMARY
            echo "| PR Title | ${{ env.PR_TITLE }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Author | ${{ env.PR_AUTHOR }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Source Branch | ${{ github.head_ref }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Target Branch | ${{ github.base_ref }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Commit SHA | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
            echo "| PR URL | ${{ env.PR_URL }} |" >> $GITHUB_STEP_SUMMARY

          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Execution Overview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | $ENVIRONMENT |" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | $BROWSER |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📈 Execution Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | $BROWSER |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | $ENVIRONMENT |" >> $GITHUB_STEP_SUMMARY
          echo "| Retry Count | ${{ github.event.inputs.retries || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Workers | ${{ github.event.inputs.workers || 'default' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Execution Mode | ${{ github.event.inputs.execution_mode || 'headless' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Publish Report | ${{ github.event.inputs.publish_report || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | ${{ env.EXECUTION_DURATION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Playwright Version | ${{ env.PLAYWRIGHT_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node Version | ${{ env.NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Runner OS | ${{ env.RUNNER_OS_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Start Time | ${{ env.START_DATE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| End Time | ${{ env.END_DATE }} |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Test Execution Analytics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "> Automated Playwright execution metrics and test health overview." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Key Metrics" >> $GITHUB_STEP_SUMMARY

          echo "#### 📈 Pass Rate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.PASS_RATE }}%" >> $GITHUB_STEP_SUMMARY

          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Total Tests | ${{ env.TOTAL_TESTS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | ${{ env.PASSED_TESTS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | ${{ env.FAILED_TESTS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚠️ Flaky | ${{ env.FLAKY_TESTS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭️ Skipped | ${{ env.SKIPPED_TESTS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📈 Pass Rate | ${{ env.PASS_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| 📉 Failure Rate | ${{ env.FAILURE_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔄 Flaky Rate | ${{ env.FLAKY_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏱️ Duration | ${{ env.EXECUTION_DURATION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏆 Quality Score | ${{ env.QUALITY_SCORE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Browser | $BROWSER |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚦 Execution Health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$FAILED_TESTS" -eq 0 ] && [ "$FLAKY_TESTS" -eq 0 ]; then
            echo "🟢 Excellent - All tests passed." >> $GITHUB_STEP_SUMMARY
          elif [ "$FAILED_TESTS" -eq 0 ] && [ "$FLAKY_TESTS" -gt 0 ]; then
            echo "🟡 Stable with Flaky Tests Detected." >> $GITHUB_STEP_SUMMARY
          else
            echo "🔴 Failures Detected. Investigation Required." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🧪 Test Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Metric | Count | %" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | ${{ env.PASSED_TESTS }} | ${{ env.PASS_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | ${{ env.FAILED_TESTS }} | ${{ env.FAILURE_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚠️ Flaky | ${{ env.FLAKY_TESTS }} | ${{ env.FLAKY_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭️ Skipped | ${{ env.SKIPPED_TESTS }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Total | ${{ env.TOTAL_TESTS }} | 100% |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🌐 Application Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          cat application-summary.md >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Module Breakdown" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          cat module-breakdown.md >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Generated Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Report | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Playwright HTML Report | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| Allure Report | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| Allure Results | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Results | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| Failure Screenshots | ✅ Generated |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Available Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "pull_request" ]; then

            echo "- pr-failure-screenshots-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "- pr-playwright-report-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "- pr-playwright-json-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "- pr-allure-report-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "- pr-allure-results-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "- pr-test-results-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY

          else

            echo "- failure-screenshots-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "- playwright-report-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "- playwright-json-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "- allure-report-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "- allure-results-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "- test-results-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY

          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 Report Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Playwright Report: Workflow Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Allure Report: Workflow Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Allure Results: Workflow Artifacts" >> $GITHUB_STEP_SUMMARY

      - name: 📄 Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-playwright-report-{0}', github.run_number) || format('playwright-report-{0}', github.run_number) }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: 📸 Upload Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-failure-screenshots-{0}', github.run_number) || format('failure-screenshots-{0}', github.run_number) }}
          # name: failure-screenshots-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore

      - name: 📦 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-test-results-{0}', github.run_number) || format('test-results-{0}', github.run_number) }}
          path: test-results/
          if-no-files-found: ignore

      - name: 📄 Upload JSON Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-playwright-json-{0}', github.run_number) || format('playwright-json-{0}', github.run_number) }}
          path: playwright-report/results.json
          if-no-files-found: ignore

      - name: 📊 Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-allure-results-{0}', github.run_number) || format('allure-results-{0}', github.run_number) }}
          path: allure-results/
          if-no-files-found: ignore

      - name: 🛠️ Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: 📊 Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            allure generate allure-results --clean -o allure-report
          else
            echo "No allure-results found. Skipping."
          fi

      - name: 📊 Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-allure-report-{0}', github.run_number) || format('allure-report-{0}', github.run_number) }}
          path: allure-report/
          if-no-files-found: ignore

      - name: 📣 Notify Slack - Manual Validation
        if: always() && github.event_name == 'workflow_dispatch'
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_GITHUB_ACTIONS_PR_MANUAL_SLACK_BOT_TOKEN }}
          payload: |
            channel: "C0CDR49PPSL"
            text: |
              🎭 Manual Playwright Validation Completed

              📊 Status: ${{ job.status }}

              🚀 Trigger: Manual Validation (workflow_dispatch)
              🌍 Environment: ${{ github.event.inputs.environment }}
              🌐 Browser: ${{ github.event.inputs.browser }}
              📁 Folder: ${{ github.event.inputs.folder }}
              🏷️ Tag: ${{ github.event.inputs.tag || 'N/A' }}
              🖥️ Mode: ${{ github.event.inputs.execution_mode }}

              🔄 Retries: ${{ github.event.inputs.retries }}
              ⚡ Workers: ${{ github.event.inputs.workers }}
              📢 Publish Report: ${{ github.event.inputs.publish_report }}

              🎭 Playwright Version: ${{ env.PLAYWRIGHT_VERSION }}

              👤 Triggered By: ${{ github.actor }}
              🌿 Branch: ${{ github.ref_name }}

              ⏱️ Duration: ${{ env.EXECUTION_DURATION }}

              📄 Playwright HTML Report
              📊 Allure Report
              📦 Workflow Artifacts

              🔗 Workflow:
              <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open Workflow>

      - name: 📣 Notify Slack - PR Validation
        if: always() && github.event_name == 'pull_request'
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_GITHUB_ACTIONS_PR_MANUAL_SLACK_BOT_TOKEN }}
          payload: |
            channel: "C0CDR49PPSL"
            text: |
              ✅ Pull Request Validation Completed
              
              📊 Status: ${{ job.status }}

              🔖 PR Number: #${{ env.PR_NUMBER }}

              📝 PR Title:
              ${{ env.PR_TITLE }}

              👤 Author:
              ${{ env.PR_AUTHOR }}

              🌿 Source Branch:
              ${{ github.head_ref }}

              🎯 Target Branch:
              ${{ github.base_ref }}

              🔒 Commit SHA:
              ${{ github.sha }}

              🔗 PR URL:
              ${{ env.PR_URL }}

              🎭 Playwright Version:
              ${{ env.PLAYWRIGHT_VERSION }}

              📦 Node Version:
              ${{ env.NODE_VERSION }}

              💻 OS:
              ${{ env.RUNNER_OS_NAME }}

              🌐 Browser:
              Chromium

              ⏱️ Duration:
              ${{ env.EXECUTION_DURATION }}

              🔗 Workflow:
              <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open Workflow>

      - name: 📝 Generate PR Comment
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failure"
          fi

          if [ "${{ job.status }}" = "success" ]; then
            TITLE="✅ Playwright Validation Passed"
          else
            TITLE="❌ Playwright Validation Failed"
          fi

          cat <<EOF > pr-comment.md
          <!-- playwright-validation-report -->

          # $TITLE

          ## Pull Request Details

          | Item | Value |
          |--------|--------|
          | PR Number | #${{ env.PR_NUMBER }} |
          | PR Title | ${{ env.PR_TITLE }} |
          | Author | ${{ env.PR_AUTHOR }} |
          | Source Branch | ${{ github.head_ref }} |
          | Target Branch | ${{ github.base_ref }} |
          | Status | $STATUS |

          ## Execution Metrics

          | Metric | Value |
          |--------|--------|
          | Browser | Chromium |
          | Duration | ${{ env.EXECUTION_DURATION }} |
          | Node Version | ${{ env.NODE_VERSION }} |
          | Playwright Version | ${{ env.PLAYWRIGHT_VERSION }} |

          ## Test Statistics

          | Metric | Count |
          |--------|--------|
          | Passed | ${{ env.PASSED_TESTS }} |
          | Failed | ${{ env.FAILED_TESTS }} |
          | Skipped | ${{ env.SKIPPED_TESTS }} |
          | Total | ${{ env.TOTAL_TESTS }} |

          ## Reports

          - Playwright HTML Report
          - Allure Report

          🔗 Workflow:
          [Open Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          EOF

      - name: 💬 Create or Update PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body = fs.readFileSync('pr-comment.md', 'utf8');

            const marker = '<!-- playwright-validation-report -->';

            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number
              });

            const existingComment = comments.find(
              comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body
              });

              core.info('Updated existing PR comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });

              core.info('Created new PR comment');
            }


