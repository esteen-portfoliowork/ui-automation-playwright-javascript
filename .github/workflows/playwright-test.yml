      #     echo "===== MODULE BREAKDOWN ====="
      #     cat module-breakdown.md

      #     echo "===== TAG SUMMARY ====="
      #     cat tag-execution-summary.md

      #     echo "===== FAILED MODULE ====="
      #     cat failed-modules.md

      #     echo "===== FAILED TESTS ====="
      #     cat failed-tests.md

      #     echo "===== SLACK TABLE OUTPUTS ====="
      #     echo '${{ steps.breakdown.outputs.APPLICATION_HEALTH_ROWS }}' | jq .
      #     echo '${{ steps.breakdown.outputs.MODULE_BREAKDOWN_ROWS }}' | jq .
      #     echo '${{ steps.breakdown.outputs.TAG_EXECUTION_TEXT }}' | jq .
      #     echo '${{ steps.generate_failure_flakiness_risk_performance_report.outputs.FAILED_MODULES_SLACK }}'
      #     echo '${{ steps.generate_failure_flakiness_risk_performance_report.outputs.FAILED_TESTS_SLACK }}'

      - name: 📄 Upload Playwright Report
        id: upload_playwright_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-playwright-report-{0}', github.run_number) || format('playwright-report-{0}', github.run_number) }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📸 Upload Test Results & Failure Attachments
        id: upload_test_results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-failure-screenshots-{0}', github.run_number) || format('failure-screenshots-{0}', github.run_number) }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📄 Upload JSON Results
        id: upload_json_results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-playwright-json-{0}', github.run_number) || format('playwright-json-{0}', github.run_number) }}
          path: playwright-report/results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 📊 Upload Allure Results
        id: upload_allure_results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-allure-results-{0}', github.run_number) || format('allure-results-{0}', github.run_number) }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: 🛠️ Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: 📊 Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ -n "$(find allure-results -type f -print -quit)" ]; then
            allure generate allure-results --clean -o allure-report
          else
            echo "No Allure results found. Skipping report generation."
          fi

      - name: 📊 Upload Allure Report
        id: upload_allure_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-allure-report-{0}', github.run_number) || format('allure-report-{0}', github.run_number) }}
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 7

      # - name: Create PR Info
      #   id: pr_info
      #   if: always() && github.event_name == 'pull_request'
      #   run: |
      #     {
      #       echo 'INFO<<EOF'
      #       echo "*🤖 Auto Merge:* Pending"
      #       echo "*🔀 PR:* #${{ github.event.pull_request.number }}"
      #       echo "*📝 Title:* ${{ github.event.pull_request.title }}"
      #       echo "*🔗 Pull Request:* ${{ github.event.pull_request.html_url }}"
      #       echo "*👤 Author:* ${{ github.event.pull_request.user.login }}"
      #       echo "*🌿 Source Branch:* ${{ github.event.pull_request.head.ref }}"
      #       echo "*🎯 Target Branch:* ${{ github.head_ref }}"
      #       echo "*🏷️ Labels:* ${{ steps.labels.outputs.LABELS }}"
      #       echo "*🔖 Commit SHA:* ${{ github.sha }}"
      #       echo EOF
      #     } >> $GITHUB_OUTPUT

      - name: 📤 Upload Markdown Reports
        id: upload_markdown_reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-markdown-execution-reports-{0}', github.run_number) || format('markdown-execution-reports-{0}', github.run_number) }}
          path: |
            release-readiness.md
            release-readiness.json
            application-health-dashboard.md
            module-breakdown.md
            tag-execution-summary.md
            top-risk-modules.md
            failed-modules.md
            failed-tests.md
            flaky-tests.md
            slowest-module.md
            report-links.md
          if-no-files-found: warn
          retention-days: 7

      - name: 🔗 Prepare Report Links
        id: report_links
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAYWRIGHT_REPORT_URL: ${{ steps.upload_playwright_report.outputs.artifact-url }}
          TEST_RESULTS_URL: ${{ steps.upload_test_results.outputs.artifact-url }}
          JSON_RESULTS_URL: ${{ steps.upload_json_results.outputs.artifact-url }}
          ALLURE_RESULTS_URL: ${{ steps.upload_allure_results.outputs.artifact-url }}
          ALLURE_REPORT_URL: ${{ steps.upload_allure_report.outputs.artifact-url }}
          MARKDOWN_REPORT_URL: ${{ steps.upload_markdown_reports.outputs.artifact-url }}
        run: |
          # ------- Generate Markdown Report Links -------
          {
            echo ""
            echo "| **Report** | **Link** |"
            echo "| ----------------------------- | -------- |"
            echo "| 🎭 Playwright Report | ${PLAYWRIGHT_REPORT_URL:+[Download]($PLAYWRIGHT_REPORT_URL)} |"
            echo "| 🧪 Test Results & Attachments | ${TEST_RESULTS_URL:+[Download]($TEST_RESULTS_URL)} |"
            echo "| 📄 JSON Results | ${JSON_RESULTS_URL:+[Download]($JSON_RESULTS_URL)} |"
            echo "| 📊 Allure Results | ${ALLURE_RESULTS_URL:+[Download]($ALLURE_RESULTS_URL)} |"
            echo "| 📊 Allure Report | ${ALLURE_REPORT_URL:+[Download]($ALLURE_REPORT_URL)} |"
            echo "| 📁 Markdown Execution Reports | ${MARKDOWN_REPORT_URL:+[Download]($MARKDOWN_REPORT_URL)} |"
            echo ""
            echo "[🔍 View GitHub Actions Run]($RUN_URL)"
          } > report-links.md

          # ------- Generate Slack Report Links -------
          SLACK_LINKS="<${RUN_URL}|GitHub Actions Run>"
          if [ -n "$PLAYWRIGHT_REPORT_URL" ]; then
            SLACK_LINKS="$SLACK_LINKS | <${PLAYWRIGHT_REPORT_URL}|Playwright Report>"
          fi
          if [ -n "$TEST_RESULTS_URL" ]; then
            SLACK_LINKS="$SLACK_LINKS | <${TEST_RESULTS_URL}|Test Results>"
          fi
          if [ -n "$JSON_RESULTS_URL" ]; then
            SLACK_LINKS="$SLACK_LINKS | <${JSON_RESULTS_URL}|JSON Results>"
          fi
          if [ -n "$ALLURE_RESULTS_URL" ]; then
            SLACK_LINKS="$SLACK_LINKS | <${ALLURE_RESULTS_URL}|Allure Results>"
          fi
          if [ -n "$ALLURE_REPORT_URL" ]; then
            SLACK_LINKS="$SLACK_LINKS | <${ALLURE_REPORT_URL}|Allure Report>"
          fi
          if [ -n "$MARKDOWN_REPORT_URL" ]; then
            SLACK_LINKS="$SLACK_LINKS | <${MARKDOWN_REPORT_URL}|Markdown Execution Reports>"
          fi
          echo "REPORT_LINKS_SLACK=$SLACK_LINKS" >> "$GITHUB_OUTPUT"

      - name: 🎨 Prepare Build Status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "BUILD_STATUS=PASSED" >> $GITHUB_ENV
            echo "BUILD_EMOJI=🟢" >> $GITHUB_ENV
            echo "BUILD_TEXT=✅ Build Status: PASSED" >> $GITHUB_ENV
            echo "BUILD_COLOR=good" >> $GITHUB_ENV
          else
            echo "BUILD_STATUS=FAILED" >> $GITHUB_ENV
            echo "BUILD_EMOJI=🔴" >> $GITHUB_ENV
            echo "BUILD_TEXT=❌ Build Status: FAILED" >> $GITHUB_ENV
            echo "BUILD_COLOR=danger" >> $GITHUB_ENV
          fi

      - name: 🚦 Prepare Execution Health
        if: always()
        run: |
          if [ "$FAILED_TESTS" -eq 0 ] && [ "$FLAKY_TESTS" -eq 0 ]; then
            echo "EXECUTION_HEALTH=🟢 Excellent - All Tests Passed" >> $GITHUB_ENV
          elif [ "$FAILED_TESTS" -eq 0 ] && [ "$FLAKY_TESTS" -gt 0 ]; then
            echo "EXECUTION_HEALTH=🟡 Stable with Flaky Tests" >> $GITHUB_ENV
          else
            echo "EXECUTION_HEALTH=🔴 Failures Detected - Investigation Required" >> $GITHUB_ENV
          fi

      - name: 📋 Generate Execution Summary
        if: always()
        run: |
          echo "# 🎭 Playwright Execution Summary" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "## ${{ env.BUILD_EMOJI }} Pull Request Validation" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ${{ env.BUILD_EMOJI }} Manual Validation" >> $GITHUB_STEP_SUMMARY
          fi

          echo "${{ env.BUILD_TEXT }}" >> $GITHUB_STEP_SUMMARY

          echo "## 🚦 Execution Health" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.EXECUTION_HEALTH }}" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Executed ${{ env.TOTAL_TESTS }} automated tests with a pass rate of ${{ env.PASS_RATE }}% in ${{ env.EXECUTION_DURATION }}." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📋 Execution Overview" >> $GITHUB_STEP_SUMMARY

          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Browser | ${{ env.BROWSER }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "| 📁 Test Folder | ${{ github.event.inputs.folder }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🏷️ Test Tag Filter | ${{ env.EXECUTED_TAG }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🏷️ Executed Tag | ${{ env.EXECUTED_TAG }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| 🌍 Environment | ${{ env.ENVIRONMENT }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "| 🖥️ Execution Mode | ${{ github.event.inputs.execution_mode }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔄 Retry Count | ${{ github.event.inputs.retries }} |" >> $GITHUB_STEP_SUMMARY
            echo "| ⚡ Parallel Workers | ${{ github.event.inputs.workers }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 📢 Publish Report | ${{ github.event.inputs.publish_report }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| 🎭 Playwright Version | ${{ env.PLAYWRIGHT_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Node Version | ${{ env.NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 💻 Runner OS | ${{ env.RUNNER_OS_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ▶️ Start Time | ${{ env.START_DATE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏹️ End Time | ${{ env.END_DATE }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📋 Pull Request Details" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔢 PR Number | #${{ env.PR_NUMBER }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 📝 PR Title | ${{ env.PR_TITLE }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔗 PR URL | ${{ env.PR_URL }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 👤 Author | ${{ env.PR_AUTHOR }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🌿 Source Branch | ${{ env.PR_BRANCH }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🎯 Target Branch | ${{ env.PR_BASE_BRANCH }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🏷️ Label | ${{ env.PR_LABELS }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔖 Commit SHA | ${{ env.PR_SHA }} |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "## 🚦 Release Readiness" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat release-readiness.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📊 Execution Metrics" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value | % |" >> $GITHUB_STEP_SUMMARY
          echo "|:----------:|:----------:|:----------:|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Total Tests | ${{ env.TOTAL_TESTS }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | ${{ env.PASSED_TESTS }} | ${{ env.PASS_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | ${{ env.FAILED_TESTS }} | ${{ env.FAILURE_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚠️ Flaky | ${{ env.FLAKY_TESTS }} | ${{ env.FLAKY_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭️ Skipped | ${{ env.SKIPPED_TESTS }} | ${{ env.SKIPPED_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏆 Quality Score | - | ${{ env.QUALITY_SCORE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏱️ Duration | ${{ env.EXECUTION_DURATION }} | - |" >> $GITHUB_STEP_SUMMARY

          echo "## 🌐 Application Health Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat application-health-dashboard.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📦 Module Breakdown" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat module-breakdown.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🏷️ Tag Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat tag-execution-summary.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🏆 Top Risk Module" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat top-risk-modules.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## ❌ Failed Modules" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat failed-modules.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## ❌ Failed Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat failed-tests.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## ⚠️ Flaky Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat flaky-tests.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## ⏱️ Slowest Module" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat slowest-module.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🔗 Report Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat report-links.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.upload_markdown_reports.outputs.artifact-url }}" ]; then
            echo "[📄 Download Markdown Execution Reports](${{ steps.upload_markdown_reports.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📣 Notify Slack - Manual Validation
        if: always() && github.event_name == 'workflow_dispatch'
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_GITHUB_ACTIONS_PR_MANUAL_SLACK_BOT_TOKEN }}
          payload: |
            channel: "C0CDR49PPSL"
            text: "Playwright execution summary. See the message blocks for application health and module breakdown details."

            blocks:
              - type: header
                level: 1
                text:
                  type: plain_text
                  text: "🎭 Playwright Execution Summary"

              - type: divider

              - type: header
                level: 2
                text:
                  type: plain_text
                  text: "${{ env.BUILD_EMOJI }} Manual Validation"

              - type: section
                text:
                  type: plain_text
                  text: "${{ env.BUILD_TEXT }}"

              - type: divider

              - type: header
                level: 2
                text:
                  type: plain_text
                  text: "🚦 Execution Health"

              - type: section
                text:
                  type: plain_text
                  text: "${{ env.EXECUTION_HEALTH }}"

              - type: section
                text:
                  type: plain_text
                  text: "Executed ${{ env.TOTAL_TESTS }} automated tests with a pass rate of ${{ env.PASS_RATE }}% in ${{ env.EXECUTION_DURATION }}."

              - type: divider

              - type: header
                level: 2
                text:
                  type: plain_text
                  text: "📋 Execution Overview"

              - type: table
                column_settings:
                  - is_wrapped: true
                  - align: center
                rows:
                  - - type: raw_text
                      text: "Item"
                    - type: raw_text
                      text: "Value"
                  - - type: raw_text
                      text: "🌐 Browser"
                    - type: raw_text
                      text: "${{ env.BROWSER }}"
                  - - type: raw_text
                      text: "📁 Test Folder"
                    - type: raw_text
                      text: "${{ github.event.inputs.folder }}"
                  - - type: raw_text
                      text: "🏷️ Test Tag Filter"
                    - type: raw_text
                      text: "${{ env.EXECUTED_TAG }}"
                  - - type: raw_text
                      text: "🌍 Environment"
                    - type: raw_text
                      text: "${{ env.ENVIRONMENT }}"
                  - - type: raw_text
                      text: "🖥️ Execution Mode"
                    - type: raw_text
                      text: "${{ github.event.inputs.execution_mode }}"
                  - - type: raw_text
                      text: "🔄 Retry Count"
                    - type: raw_text
                      text: "${{ github.event.inputs.retries }}"
                  - - type: raw_text
                      text: "⚡ Parallel Workers"
                    - type: raw_text
                      text: "${{ github.event.inputs.workers }}"
                  - - type: raw_text
                      text: "📢 Publish Report"
                    - type: raw_text
                      text: "${{ github.event.inputs.publish_report }}"
                  - - type: raw_text
                      text: "🎭 Playwright Version"
                    - type: raw_text
                      text: "${{ env.PLAYWRIGHT_VERSION }}"
                  - - type: raw_text
                      text: "📦 Node Version"
                    - type: raw_text
                      text: "${{ env.NODE_VERSION }}"
                  - - type: raw_text
                      text: "💻 Runner OS"
                    - type: raw_text
                      text: "${{ env.RUNNER_OS_NAME }}"
                  - - type: raw_text
                      text: "▶️ Start Time"
                    - type: raw_text
                      text: "${{ env.START_DATE }}"
                  - - type: raw_text
                      text: "⏹️ End Time"
                    - type: raw_text
                      text: "${{ env.END_DATE }}"

              - type: divider

              - type: header
                level: 2
                text:
                  type: plain_text
                  text: "📊 Execution Metrics"

              - type: table
                column_settings:
                  - is_wrapped: true
                  - align: center
                rows:
                  - - type: raw_text
                      text: "Metric"
                    - type: raw_text
                      text: "Value"
                    - type: raw_text
                      text: "%"
                  - - type: raw_text
                      text: "🧪 Total Tests"
                    - type: raw_text
                      text: "${{ env.TOTAL_TESTS }}"
                    - type: raw_text
                      text: "-"
                  - - type: raw_text
                      text: "✅ Passed"
                    - type: raw_text
                      text: "${{ env.PASSED_TESTS }}"
                    - type: raw_text
                      text: "${{ env.PASS_RATE }}%"
                  - - type: raw_text
                      text: "❌ Failed"
                    - type: raw_text
                      text: "${{ env.FAILED_TESTS }}"
                    - type: raw_text
                      text: "${{ env.FAILURE_RATE }}%"
                  - - type: raw_text
                      text: "⚠️ Flaky"
                    - type: raw_text
                      text: "${{ env.FLAKY_TESTS }}"
                    - type: raw_text
                      text: "${{ env.FLAKY_RATE }}%"
                  - - type: raw_text
                      text: "⏭️ Skipped"
                    - type: raw_text
                      text: "${{ env.SKIPPED_TESTS }}"
                    - type: raw_text
                      text: "${{ env.SKIPPED_RATE }}%"
                  - - type: raw_text
                      text: "🏆 Quality Score"
                    - type: raw_text
                      text: "-"
                    - type: raw_text
                      text: "${{ env.QUALITY_SCORE }}%"
                  - - type: raw_text
                      text: "⏱️ Duration"
                    - type: raw_text
                      text: "${{ env.EXECUTION_DURATION }}"
                    - type: raw_text
                      text: "-"

              - type: divider

              - type: header
                level: 2
                text:
                  type: plain_text
                  text: "🚦 Release Readiness"

              - type: section
                text:
                  type: mrkdwn
                  text: ${{ toJson(steps.generate_failure_flakiness_risk_performance_report.outputs.RELEASE_READINESS_TEXT) }}

              - type: divider

              - type: header
                level: 2
                text:
                  type: plain_text
                  text: "🌐 Application Health Dashboard"

              - type: section
                text:
                  type: mrkdwn
                  text: ${{ steps.breakdown.outputs.APPLICATION_HEALTH_TEXT || 'N/A' }}

              - type: divider

              - type: header
                level: 2
                text:
                  type: plain_text
                  text: "📦 Module Breakdown"

              - type: section
                text:
                  type: mrkdwn
                  text: ${{ steps.breakdown.outputs.MODULE_BREAKDOWN_TEXT || 'N/A' }}

              - type: divider

              - type: header
                level: 2
                text:
                  type: plain_text
                  text: "🏷️ Tag Execution Summary"

              - type: section
                text:
                  type: mrkdwn
                  text: ${{ steps.breakdown.outputs.TAG_EXECUTION_TEXT || 'N/A' }}

              - type: divider

              - type: header
                level: 2
                text:
                  type: plain_text
                  text: "🏆 Top Risk Module"

              - type: section
                text:
                  type: mrkdwn
                  text: ${{ toJson(steps.generate_failure_flakiness_risk_performance_report.outputs.TOP_RISK_MODULE_TEXT) }}

              - type: divider

              - type: header
                level: 2
                text:
                  type: plain_text
                  text: "❌ Failed Modules"

              - type: section
                text:
                  type: mrkdwn
                  text: ${{ toJson(steps.generate_failure_flakiness_risk_performance_report.outputs.FAILED_MODULE_TEXT) }}

              - type: divider

              - type: header
                level: 2
                text:
                  type: plain_text
                  text: "❌ Failed Tests"

              - type: section
                text:
                  type: mrkdwn
                  text: ${{ toJson(steps.generate_failure_flakiness_risk_performance_report.outputs.FAILED_TEST_TEXT) }}

              - type: divider

              - type: header
                level: 2
                text:
                  type: plain_text
                  text: "⚠️ Flaky Tests"

              - type: section
                text:
                  type: mrkdwn
                  text: ${{ toJson(steps.generate_failure_flakiness_risk_performance_report.outputs.FLAKY_TEST_TEXT) }}

              - type: divider

              - type: header
                level: 2
                text:
                  type: plain_text
                  text: "⏱️ Slowest Module"

              - type: section
