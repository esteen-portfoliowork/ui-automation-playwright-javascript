name: 🎭 Playwright Validation

run-name: >
  ${{
    github.event_name == 'workflow_dispatch'
    && format('🎭 Manual Validation | {0} | {1}', github.event.inputs.environment, github.event.inputs.browser)
    || github.event_name == 'pull_request'
    && format('✅ PR #{0} | {1}', github.event.pull_request.number, github.head_ref)
    || format('✅ Push Validation #{0}', github.run_number)
  }}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  TEST_ENV: ${{ github.event.inputs.environment || 'qa' }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # Manual Trigger
  workflow_dispatch:
    inputs:
      browser:
        description: "🌐 Browser"
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      folder:
        description: "📁 Test Folder"
        required: true
        default: tests
        type: choice
        options:
          - tests

      tag:
        description: "🏷️ Test Tag Filter"
        required: false
        default: "@e2e"
        type: choice
        options:
          - "@all"
          - "@smoke"
          - "@regression"
          - "@e2e"
          - "@authentication"
          - "@inventory"
          - "@filter"
          - "@positive"
          - "@negative"

      environment:
        description: "🌍 Environment"
        required: true
        default: qa
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

      execution_mode:
        description: "🖥️ Execution Mode"
        required: true
        default: headless
        type: choice
        options:
          - headless
          - headed

      retries:
        description: "🔄 Retry Count"
        required: true
        default: "1"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"

      workers:
        description: "⚡ Parallel Workers"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "8"

      publish_report:
        description: "📢 Publish Report"
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📋 Execution Configuration
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "🌐 Browser            : ${{ inputs.browser }}"
          echo "📁 Folder             : ${{ inputs.folder }}"
          echo "🏷️ Tag                : ${{ inputs.tag }}"
          echo "🌍 Environment        : ${{ inputs.environment }}"
          echo "🖥️ Execution Mode     : ${{ inputs.execution_mode }}"
          echo "🔄 Retries            : ${{ inputs.retries }}"
          echo "⚡ Workers            : ${{ inputs.workers }}"
          echo "📢 Publish Report     : ${{ inputs.publish_report }}"

      - name: 🎛️ Generate Variables
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "EXECUTED_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
            echo "BROWSER=${{ github.event.inputs.browser || 'all' }}" >> $GITHUB_ENV
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "EXECUTED_TAG=PR Validation (All Tests)" >> $GITHUB_ENV
            echo "BROWSER=chromium" >> $GITHUB_ENV
            echo "ENVIRONMENT=N/A" >> $GITHUB_ENV
          else
            echo "EXECUTED_TAG=Push Validation (All Tests)" >> $GITHUB_ENV
            echo "BROWSER=chromium" >> $GITHUB_ENV
            echo "ENVIRONMENT=N/A" >> $GITHUB_ENV
          fi

      - name: 💻 Get Runner OS
        run: |
          echo "RUNNER_OS_NAME=$RUNNER_OS" >> $GITHUB_ENV

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Get Node Version
        run: |
          echo "NODE_VERSION=$(node -v)" >> $GITHUB_ENV

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Get Playwright Version
        run: |
          PLAYWRIGHT_VERSION=$(npx playwright --version | awk '{print $2}')
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      # # Get details of run
      # - name: 🔍 Debug Inputs
      #   run: |
      #     echo "Event: ${{ github.event_name }}"
      #     echo "Browser: ${{ github.event.inputs.browser }}"
      #     echo "Folder: ${{ github.event.inputs.folder }}"
      #     echo "Environment: ${{ github.event.inputs.environment }}"

      - name: ⏱️ Capture Start Details
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "START_DATE=$(date)" >> $GITHUB_ENV

      - name: 🧪 Execute Playwright Tests
        run: |
          CMD="npx playwright test"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            CMD="$CMD ${{ inputs.folder }}"

            if [ "${{ inputs.tag }}" != "@all" ]; then
              CMD="$CMD --grep '${{ inputs.tag }}'"
            fi

            CMD="$CMD --project=${{ inputs.browser }}"
            CMD="$CMD --workers=${{ inputs.workers }}"
            CMD="$CMD --retries=${{ inputs.retries }}"

            if [ "${{ inputs.execution_mode }}" = "headed" ]; then
              CMD="$CMD --headed"
            fi

          elif [ "${{ github.event_name }}" = "pull_request" ]; then

            CMD="$CMD --project=chromium"

          fi

          echo "Executing command:"
          echo "$CMD"
          eval "$CMD"
        continue-on-error: true

      - name: ⏱️ Capture End Details
        if: always()
        run: |
          END_TIME=$(date +%s)

          echo "END_DATE=$(date)" >> $GITHUB_ENV

          DURATION=$((END_TIME - START_TIME))

          echo "EXECUTION_DURATION=${DURATION}s" >> $GITHUB_ENV

      - name: 📊 Extract Test Statistics
        if: always()
        run: |
          PASSED=$(jq '
          [
            .suites[].suites[].specs[]
            | select(.ok == true)
            | select(
                any(.tests[].results[]?; .status=="flaky") | not
              )
          ]
          | length
          ' playwright-report/results.json)

          FAILED=$(jq '
          [
            .suites[].suites[].specs[]
            | select(.ok == false)
          ]
          | length
          ' playwright-report/results.json)

          FLAKY=$(jq '
          [
            .suites[].suites[].specs[]
            | select(
                any(.tests[].results[]?; .status=="flaky")
              )
          ]
          | length
          ' playwright-report/results.json)

          SKIPPED=$(jq '
          [
            .suites[].suites[].specs[]
            | select(
                all(.tests[].results[]?; .status=="skipped")
              )
          ]
          | length
          ' playwright-report/results.json)

          TOTAL=$(jq '
          [
            .suites[].suites[].specs[]
          ]
          | length
          ' playwright-report/results.json)

          SUM=$((PASSED + FAILED + FLAKY + SKIPPED))

          echo "Passed : $PASSED"
          echo "Failed : $FAILED"
          echo "Flaky  : $FLAKY"
          echo "Skipped: $SKIPPED"
          echo "Total  : $TOTAL"
          echo "Sum    : $SUM"

          if [ "$TOTAL" -gt 0 ]; then
            PASS_RATE=$(awk "BEGIN { printf \"%.2f\", (($PASSED + $FLAKY)/$TOTAL)*100 }")
            FAILURE_RATE=$(awk "BEGIN { printf \"%.2f\", ($FAILED/$TOTAL)*100 }")
            FLAKY_RATE=$(awk "BEGIN { printf \"%.2f\", ($FLAKY/$TOTAL)*100 }")
            SKIPPED_RATE=$(awk "BEGIN { printf \"%.2f\", ($SKIPPED/$TOTAL)*100 }")
          else
            PASS_RATE=0
            FAILURE_RATE=0
            FLAKY_RATE=0
            SKIPPED_RATE=0
          fi

          echo "PASSED_TESTS=$PASSED" >> $GITHUB_ENV
          echo "FAILED_TESTS=$FAILED" >> $GITHUB_ENV
          echo "SKIPPED_TESTS=$SKIPPED" >> $GITHUB_ENV
          echo "FLAKY_TESTS=$FLAKY" >> $GITHUB_ENV
          echo "TOTAL_TESTS=$TOTAL" >> $GITHUB_ENV

          echo "PASS_RATE=$PASS_RATE" >> $GITHUB_ENV
          echo "FAILURE_RATE=$FAILURE_RATE" >> $GITHUB_ENV
          echo "FLAKY_RATE=$FLAKY_RATE" >> $GITHUB_ENV
          echo "SKIPPED_RATE=$SKIPPED_RATE" >> $GITHUB_ENV
          if [ "$TOTAL" -gt 0 ]; then
            QUALITY_SCORE=$(awk "BEGIN { printf \"%.0f\", (($PASSED + ($FLAKY*0.5))/$TOTAL)*100 }")
          else
            QUALITY_SCORE=0
          fi

          echo "QUALITY_SCORE=$QUALITY_SCORE" >> $GITHUB_ENV

      # - name: 🔍 Debug Specs
      #   if: always()
      #   run: |
      #     jq '
      #       .suites[].suites[]
      #       | {
      #           file,
      #           specs
      #         }
      #     ' playwright-report/results.json

      # - name: 🔍 Debug Playwright Structure
        # if: always()
        # run: |
        #   jq '
        #     ..
        #     | objects
        #     | select(has("file"))
        #     | {file,title,status}
        #   ' playwright-report/results.json | head -100

      - name: 📋 Collect PR Details
        if: github.event_name == 'pull_request'
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "PR_TITLE=${{ github.event.pull_request.title }}" >> $GITHUB_ENV
          echo "PR_AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_ENV
          echo "PR_URL=${{ github.event.pull_request.html_url }}" >> $GITHUB_ENV
          echo "PR_BRANCH=${{ github.event.pull_request.head.ref }}" >> $GITHUB_ENV
          echo "PR_BASE_BRANCH=${{ github.event.pull_request.base.ref }}" >> $GITHUB_ENV
          echo "PR_LABELS=${{ join(github.event.pull_request.labels.*.name, ', ') }}" >> $GITHUB_ENV

      # - name: 🔍 Debug Playwright Report
      #   if: always()
      #   run: |
      #     echo "Checking report..."

      #     ls -R playwright-report || true

      #     if [ -f playwright-report/results.json ]; then
      #       echo "results.json exists"

      #       echo "===== FIRST 100 LINES ====="
      #       head -100 playwright-report/results.json

      #       echo "===== TEST STATUS ENTRIES ====="
      #       jq '.. | .status? // empty' playwright-report/results.json
            
      #     else
      #       echo "results.json NOT FOUND"
      #     fi

      # - name: 🔍 Find Outcome Structure
      #   if: always()
      #   run: |
      #     echo "===== SEARCH outcome ====="
      #     grep -n "outcome" playwright-report/results.json | head -20

      #     echo "===== SEARCH status ====="
      #     grep -n "status" playwright-report/results.json | head -20

      #     echo "===== SEARCH title ====="
      #     grep -n "title" playwright-report/results.json | head -20

      # - name: 🔍 Inspect Test Node
      #   if: always()
      #   run: |
      #     jq '
      #       ..
      #       | objects
      #       | select(has("title"))
      #       | {title,status,outcome}
      #     ' playwright-report/results.json | head -200

      - name: 📦 Build Breakdown Data
        id: breakdown
        if: always()
        run: |
          get_app_name() {
            case "$1" in
              sauce-demo)   echo "SauceDemo" ;;
              orangehr)     echo "OrangeHR" ;;
              qa-playground) echo "QA Playground" ;;
              *)            echo "$1" ;;
            esac
          }

          if [ ! -f "playwright-report/results.json" ]; then
            echo "Playwright results not found."
            exit 0
          fi

          echo "| Application | Module | ✅ Passed | ❌ Failed |" > module-breakdown.md
          echo "|-------------|--------|-----------|-----------|" >> module-breakdown.md

          jq -r '
            .suites[].suites[]
            | select(.file != null)
            | [
                .file,
                ([.specs[] | select(.ok)] | length),
                ([.specs[] | select(.ok == false)] | length)
              ]
            | @tsv
          ' playwright-report/results.json |
          while IFS=$'\t' read -r FILE PASSED FAILED
          do
            APP=$(cut -d'/' -f1 <<< "$FILE")
            MODULE=$(basename "$FILE" .spec.js)

            APP_NAME=$(get_app_name "$APP")

            MODULE_NAME=$(echo "$MODULE" \
              | sed 's/-/ /g' \
              | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)}1')

            echo "| $APP_NAME | $MODULE_NAME | $PASSED | $FAILED |" >> module-breakdown.md
          done

          # DISPLAY_LIMIT=5

          TOTAL_MODULES=$(
            awk -F'|' '
            NF > 4 {
              gsub(/^[ \t]+|[ \t]+$/, "", $2)

              FAILED=$5 + 0

              if ($2 != "Application" && $2 != "Module" && $2 != "-------------" && FAILED > 0)
                count++
            }
            END {
              print count
            }
            ' module-breakdown.md
          )

          {
            echo "MODULE_BREAKDOWN<<EOF"

            if [ -f module-breakdown.md ]; then

              awk -F'|' '
              NF > 4 {
                gsub(/^[ \t]+|[ \t]+$/, "", $2)
                gsub(/^[ \t]+|[ \t]+$/, "", $4)
                gsub(/^[ \t]+|[ \t]+$/, "", $5)

                if ($2 != "Module" && $2 != "-------------")
                  printf "• %s: ✅ %s | ❌ %s\n", $2, $4, $5
              }
              ' module-breakdown.md | head -"$DISPLAY_LIMIT"

              if [ "$TOTAL_MODULES" -gt "$DISPLAY_LIMIT" ]; then
                echo ""
                echo "...and $((TOTAL_MODULES - DISPLAY_LIMIT)) more modules"
              fi

            else
              echo "No module data available"
            fi

            echo EOF
          } >> $GITHUB_ENV

          echo "| Application | ✅ Passed | ❌ Failed |" > application-summary.md
          echo "|-------------|-----------|-----------|" >> application-summary.md

          jq -r '
            .suites[].suites[]
            | select(.file != null)
            | [
                (.file | split("/")[0]),
                ([.specs[] | select(.ok)] | length),
                ([.specs[] | select(.ok == false)] | length)
              ]
            | @tsv
          ' playwright-report/results.json |
          awk -F'\t' '
          {
            passed[$1] += $2;
            failed[$1] += $3;
          }
          END {
            for (app in passed)
              print app "\t" passed[app] "\t" failed[app];
          }' |
          sort |
          while IFS=$'\t' read -r APP PASSED FAILED
          do
            APP_NAME=$(get_app_name "$APP")
            echo "| $APP_NAME | $PASSED | $FAILED |" >> application-summary.md
          done

          {
            echo "APPLICATION_BREAKDOWN<<EOF"

            awk -F'|' '
            NF > 3 {
              gsub(/^[ \t]+|[ \t]+$/, "", $2)
              gsub(/^[ \t]+|[ \t]+$/, "", $3)
              gsub(/^[ \t]+|[ \t]+$/, "", $4)

              if ($2 != "Application" && $2 != "-------------")
                printf "• %s: ✅ %s | ❌ %s\n", $2, $3, $4
            }
            ' application-summary.md

            echo EOF
          } >> $GITHUB_OUTPUT

          {
            echo "MODULE_BREAKDOWN<<EOF"

            awk -F'|' '
            NF > 4 {
              gsub(/^[ \t]+|[ \t]+$/, "", $2)
              gsub(/^[ \t]+|[ \t]+$/, "", $4)
              gsub(/^[ \t]+|[ \t]+$/, "", $5)

              if ($2 != "Module" && $2 != "-------------")
                printf "• %s: ✅ %s | ❌ %s\n", $2, $4, $5
            }
            ' module-breakdown.md | head -5

            echo EOF
          } >> $GITHUB_OUTPUT

          echo "| Tag | Total | ✅ Passed | ❌ Failed | ⏭️ Skipped | 📈 Pass Rate |" > tag-summary.md
          echo "|-----|-------|-----------|-----------|------------|--------------|" >> tag-summary.md

          {
            echo "TAG_BREAKDOWN<<EOF"

            awk -F'|' '
            NF > 5 {
              gsub(/^[ \t]+|[ \t]+$/, "", $2)
              gsub(/^[ \t]+|[ \t]+$/, "", $4)
              gsub(/^[ \t]+|[ \t]+$/, "", $5)

              if ($2 != "Tag" && $2 != "-----")
                printf "• %s: ✅ %s | ❌ %s\n", $2, $4, $5
            }
            ' tag-summary.md | head -5

            echo EOF
          } >> $GITHUB_OUTPUT

          # Exclude application tags from tag analytics
          jq -r '
            .suites[].suites[]
            | .specs[]
            | . as $spec
            | .tags[]
            | select(
                . != "sauce-demo" and
                . != "orangehr" and
                . != "qa-playground"
              )
            | [
                .,
                (if $spec.ok then 1 else 0 end),
                (if $spec.ok then 0 else 1 end)
              ]
            | @tsv
          ' playwright-report/results.json |
          awk -F $'\t' '
          {
            total[$1]++
            passed[$1] += $2
            failed[$1] += $3
          }
          END {
            for (tag in total) {
              skipped = 0
              rate = (passed[tag] / total[tag]) * 100

              printf "%s\t%d\t%d\t%d\t%d\t%.2f\n",
                tag,
                total[tag],
                passed[tag],
                failed[tag],
                skipped,
                rate
            }
          }
          ' |
          sort |
          while IFS=$'\t' read -r TAG TOTAL PASSED FAILED SKIPPED RATE
          do
              echo "| @$TAG | $TOTAL | $PASSED | $FAILED | $SKIPPED | $RATE% |" >> tag-summary.md
          done

      - name: 📣 Build Slack Data
        id: slack_data
        if: always()
        run: |
          DISPLAY_LIMIT=5
          
          # Application Summary
          APPLICATION=$(awk -F'|' '
            NF > 3 {
              gsub(/^[ \t]+|[ \t]+$/, "", $2)
              gsub(/^[ \t]+|[ \t]+$/, "", $3)
              gsub(/^[ \t]+|[ \t]+$/, "", $4)

              if ($2 != "Application" && $2 != "-------------")
                printf "• %s: ✅ %s ❌ %s ", $2, $3, $4
            }
          ' application-summary.md)

          MODULES=$(awk -F'|' '
            NF > 4 {
              gsub(/^[ \t]+|[ \t]+$/, "", $2)
              gsub(/^[ \t]+|[ \t]+$/, "", $4)
              gsub(/^[ \t]+|[ \t]+$/, "", $5)

              if ($2 != "Module" && $2 != "-------------")
                printf "• %s: ✅ %s ❌ %s ", $2, $4, $5
            }
          ' module-breakdown.md | head -5)

          FAILED_MODULES=$(
          awk -F'|' '
          NF > 4 {

            gsub(/^[ \t]+|[ \t]+$/, "", $2)
            gsub(/^[ \t]+|[ \t]+$/, "", $5)

            FAILED=$5+0

            if ($2 != "Module" &&
                $2 != "-------------" &&
                FAILED > 0)

              printf "• %s (%s failure) ", $2, FAILED
          }
          ' module-breakdown.md
          )

          FAILED_MODULE_COUNT=$(awk -F'|' '
          NF > 4 {

            gsub(/^[ \t]+|[ \t]+$/, "", $5)

            FAILED=$5+0

            if (FAILED > 0)
              count++
          }
          END {
            print count+0
          }
          ' module-breakdown.md)

          if [ -z "$FAILED_MODULES" ]; then
            FAILED_MODULES="✅ No failed modules"
          fi

          FAILED_COUNT=$(
          jq '
          [
            .suites[].suites[]
            | .specs[]
            | select(.ok == false)
          ]
          | length
          ' playwright-report/results.json
          )

          FAILED_TESTS=$(
          jq -r '
          .suites[].suites[]
          | .specs[]
          | select(.ok == false)
          | .title
          ' playwright-report/results.json |
          head -5 |
          paste -sd " | " -
          )

          if [ -z "$FAILED_TESTS" ]; then
            FAILED_TESTS="✅ No failed tests"
          fi

          echo "FAILED_TESTS=$FAILED_TESTS" >> $GITHUB_OUTPUT

          # Tags
          TAGS=$(awk -F'|' '
            NF > 5 {
              gsub(/^[ \t]+|[ \t]+$/, "", $2)
              gsub(/^[ \t]+|[ \t]+$/, "", $4)
              gsub(/^[ \t]+|[ \t]+$/, "", $5)

              if ($2 != "Tag" && $2 != "-----")
                printf "• %s: ✅ %s ❌ %s ", $2, $4, $5
            }
          ' tag-summary.md | head -5)

          echo "APPLICATION=$APPLICATION" >> $GITHUB_OUTPUT
          echo "MODULES=$MODULES" >> $GITHUB_OUTPUT
          echo "FAILED_MODULES=$FAILED_MODULES" >> $GITHUB_OUTPUT
          echo "FAILED_TESTS=$FAILED_TESTS" >> $GITHUB_OUTPUT
          echo "FAILED_MODULE_COUNT=$FAILED_MODULE_COUNT" >> $GITHUB_OUTPUT
          echo "FAILED_COUNT=$FAILED_COUNT" >> $GITHUB_OUTPUT
          echo "TAGS=$TAGS" >> $GITHUB_OUTPUT

      - name: 📄 Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-playwright-report-{0}', github.run_number) || format('playwright-report-{0}', github.run_number) }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📸 Upload Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-failure-screenshots-{0}', github.run_number) || format('failure-screenshots-{0}', github.run_number) }}
          # name: failure-screenshots-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📦 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-test-results-{0}', github.run_number) || format('test-results-{0}', github.run_number) }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📄 Upload JSON Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-playwright-json-{0}', github.run_number) || format('playwright-json-{0}', github.run_number) }}
          path: playwright-report/results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 📊 Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-allure-results-{0}', github.run_number) || format('allure-results-{0}', github.run_number) }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: 🛠️ Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: 📊 Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            allure generate allure-results --clean -o allure-report
          else
            echo "No allure-results found. Skipping."
          fi

      - name: 📊 Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-allure-report-{0}', github.run_number) || format('allure-report-{0}', github.run_number) }}
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Create PR Info
        id: pr_info
        if: always() && github.event_name == 'pull_request'
        run: |
          {
            echo 'INFO<<EOF'
            echo "*🤖 Auto Merge:* Pending"
            echo "*🔀 PR:* #${{ github.event.pull_request.number }}"
            echo "*🔀 Title:* ${{ github.event.pull_request.title }}"
            echo "*🔗 Pull Request:* ${{ github.event.pull_request.html_url }}"
            echo "*👤 Author:* ${{ github.event.pull_request.user.login }}"
            echo "*🌿 Source Branch:* ${{ github.event.pull_request.head.ref }}"
            echo "*🌿 Target Branch:* ${{ github.head_ref }}"
            echo "*🏷 Labels:* ${{ steps.labels.outputs.LABELS }}"
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: 🎨 Prepare Build Status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "BUILD_STATUS=PASSED" >> $GITHUB_ENV
            echo "BUILD_EMOJI=🟢" >> $GITHUB_ENV
            echo "BUILD_TEXT=✅ Build Status: PASSED" >> $GITHUB_ENV
            echo "BUILD_COLOR=good" >> $GITHUB_ENV
          else
            echo "BUILD_STATUS=FAILED" >> $GITHUB_ENV
            echo "BUILD_EMOJI=🔴" >> $GITHUB_ENV
            echo "BUILD_TEXT=❌ Build Status: FAILED" >> $GITHUB_ENV
            echo "BUILD_COLOR=danger" >> $GITHUB_ENV
          fi

      - name: 🚦 Prepare Execution Health
        if: always()
        run: |
          if [ "$FAILED_TESTS" -eq 0 ] && [ "$FLAKY_TESTS" -eq 0 ]; then
            echo "EXECUTION_HEALTH=🟢 Excellent - All Tests Passed" >> $GITHUB_ENV
          elif [ "$FAILED_TESTS" -eq 0 ] && [ "$FLAKY_TESTS" -gt 0 ]; then
            echo "EXECUTION_HEALTH=🟡 Stable with Flaky Tests" >> $GITHUB_ENV
          else
            echo "EXECUTION_HEALTH=🔴 Failures Detected - Investigation Required" >> $GITHUB_ENV
          fi

      - name: 📋 Generate Execution Summary
        if: always()
        run: |
          echo "# 🎭 Playwright Execution Summary" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "## ${{ env.BUILD_EMOJI }} Pull Request Validation" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ${{ env.BUILD_EMOJI }} Manual Validation" >> $GITHUB_STEP_SUMMARY
          fi

          echo "${{ env.BUILD_TEXT }}" >> $GITHUB_STEP_SUMMARY

          echo "## 🚦 Execution Health" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.EXECUTION_HEALTH }}" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Executed ${{ env.TOTAL_TESTS }} automated tests with a pass rate of ${{ env.PASS_RATE }}% in ${{ env.EXECUTION_DURATION }}." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📋 Execution Overview" >> $GITHUB_STEP_SUMMARY

          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Browser | ${{ env.BROWSER }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "| 📁 Test Folder | ${{ github.event.inputs.folder }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🏷️ Test Tag Filter | ${{ env.EXECUTED_TAG }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🏷️ Executed Tag | ${{ env.EXECUTED_TAG }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| 🌍 Environment | ${{ env.ENVIRONMENT }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "| 🖥️ Execution Mode | ${{ github.event.inputs.execution_mode }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔄 Retry Count | ${{ github.event.inputs.retries }} |" >> $GITHUB_STEP_SUMMARY
            echo "| ⚡ Parallel Workers | ${{ github.event.inputs.workers }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 📢 Publish Report | ${{ github.event.inputs.publish_report }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| 🎭 Playwright Version | ${{ env.PLAYWRIGHT_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Node Version | ${{ env.NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 💻 Runner OS | ${{ env.RUNNER_OS_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ▶️ Start Time | ${{ env.START_TIME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏹️ End Time | ${{ env.END_TIME }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📋 Pull Request Details" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔢 PR Number | #${{ env.PR_NUMBER }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 📝 PR Title | ${{ env.PR_TITLE }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔗 PR URL | ${{ env.PR_URL }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 👤 Author | ${{ env.PR_AUTHOR }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🌿 Source Branch | ${{ github.head_ref }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🎯 Target Branch | ${{ github.base_ref }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🏷️ Label | ${{ env.PR_LABELS }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔖 Commit SHA | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "## 📊 Execution Metrics" >> $GITHUB_STEP_SUMMARY

          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Total Tests | ${{ env.TOTAL_TESTS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | ${{ env.PASSED_TESTS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | ${{ env.FAILED_TESTS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚠️ Flaky | ${{ env.FLAKY_TESTS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭️ Skipped | ${{ env.SKIPPED_TESTS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📈 Pass Rate | ${{ env.PASS_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| 📉 Failure Rate | ${{ env.FAILURE_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔄 Flaky Rate | ${{ env.FLAKY_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎲 Skipped Rate | ${{ env.SKIPPED_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏱️ Duration | ${{ env.EXECUTION_DURATION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏆 Quality Score | ${{ env.QUALITY_SCORE }}% |" >> $GITHUB_STEP_SUMMARY

          echo "## 🌐 Application Summary" >> $GITHUB_STEP_SUMMARY

          echo "## 📦 Module Breakdown" >> $GITHUB_STEP_SUMMARY

          echo "## 🏷️ Tag Execution Summary" >> $GITHUB_STEP_SUMMARY

          echo "## ❌ Failed Module" >> $GITHUB_STEP_SUMMARY

          echo "## ❌ Failed Tests" >> $GITHUB_STEP_SUMMARY

          echo "## 🔗 Report Links" >> $GITHUB_STEP_SUMMARY

