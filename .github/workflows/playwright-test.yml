name: 🎭 Playwright Validation

run-name: >
  ${{
    github.event_name == 'workflow_dispatch'
    && format('🎭 Manual Validation | {0} | {1}', github.event.inputs.environment, github.event.inputs.browser)
    || github.event_name == 'pull_request'
    && format('✅ PR #{0} | {1}', github.event.pull_request.number, github.head_ref)
    || format('✅ Push Validation #{0}', github.run_number)
  }}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  TEST_ENV: ${{ github.event.inputs.environment || 'qa' }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # Manual Trigger
  workflow_dispatch:
    inputs:
      browser:
        description: "🌐 Browser"
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      folder:
        description: "📁 Test Folder"
        required: true
        default: tests
        type: choice
        options:
          - tests

      tag:
        description: "🏷️ Test Tag Filter"
        required: false
        default: "@e2e"
        type: choice
        options:
          - "@all"
          - "@smoke"
          - "@regression"
          - "@e2e"
          - "@authentication"
          - "@inventory"
          - "@filter"
          - "@positive"
          - "@negative"

      environment:
        description: "🌍 Environment"
        required: true
        default: qa
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

      execution_mode:
        description: "🖥️ Execution Mode"
        required: true
        default: headless
        type: choice
        options:
          - headless
          - headed

      retries:
        description: "🔄 Retry Count"
        required: true
        default: "1"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"

      workers:
        description: "⚡ Parallel Workers"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "8"

      publish_report:
        description: "📢 Publish Report"
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📋 Execution Configuration
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "🌐 Browser            : ${{ inputs.browser }}"
          echo "📁 Folder             : ${{ inputs.folder }}"
          echo "🏷️ Tag                : ${{ inputs.tag }}"
          echo "🌍 Environment        : ${{ inputs.environment }}"
          echo "🖥️ Execution Mode     : ${{ inputs.execution_mode }}"
          echo "🔄 Retries            : ${{ inputs.retries }}"
          echo "⚡ Workers            : ${{ inputs.workers }}"
          echo "📢 Publish Report     : ${{ inputs.publish_report }}"

      - name: 🎛️ Generate Variables
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "EXECUTED_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
            echo "BROWSER=${{ github.event.inputs.browser || 'all' }}" >> $GITHUB_ENV
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "EXECUTED_TAG=PR Validation (All Tests)" >> $GITHUB_ENV
            echo "BROWSER=chromium" >> $GITHUB_ENV
            echo "ENVIRONMENT=N/A" >> $GITHUB_ENV
          else
            echo "EXECUTED_TAG=Push Validation (All Tests)" >> $GITHUB_ENV
            echo "BROWSER=chromium" >> $GITHUB_ENV
            echo "ENVIRONMENT=N/A" >> $GITHUB_ENV
          fi

      - name: 💻 Get Runner OS
        run: |
          echo "RUNNER_OS_NAME=$RUNNER_OS" >> $GITHUB_ENV

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Get Node Version
        run: |
          echo "NODE_VERSION=$(node -v)" >> $GITHUB_ENV

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Get Playwright Version
        run: |
          PLAYWRIGHT_VERSION=$(npx playwright --version | awk '{print $2}')
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: ⏱️ Capture Start Details
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "START_DATE=$(date)" >> $GITHUB_ENV

      - name: 🧪 Execute Playwright Tests
        run: |
          CMD="npx playwright test"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            CMD="$CMD ${{ inputs.folder }}"

            if [ "${{ inputs.tag }}" != "@all" ]; then
              CMD="$CMD --grep '${{ inputs.tag }}'"
            fi

            CMD="$CMD --project=${{ inputs.browser }}"
            CMD="$CMD --workers=${{ inputs.workers }}"
            CMD="$CMD --retries=${{ inputs.retries }}"

            if [ "${{ inputs.execution_mode }}" = "headed" ]; then
              CMD="$CMD --headed"
            fi

          elif [ "${{ github.event_name }}" = "pull_request" ]; then

            CMD="$CMD --project=chromium"

          fi

          echo "Executing command:"
          echo "$CMD"
          eval "$CMD"
        continue-on-error: true

      - name: ⏱️ Capture End Details
        if: always()
        run: |
          END_TIME=$(date +%s)

          echo "END_DATE=$(date)" >> $GITHUB_ENV

          DURATION=$((END_TIME - START_TIME))

          echo "EXECUTION_DURATION=${DURATION}s" >> $GITHUB_ENV

      - name: 📊 Extract Test Statistics
        if: always()
        run: |
          PASSED=$(jq '
          [
            .suites[].suites[].specs[]
            | select(.ok == true)
            | select(
                any(.tests[].results[]?; .status=="flaky") | not
              )
          ]
          | length
          ' playwright-report/results.json)

          FAILED=$(jq '
          [
            .suites[].suites[].specs[]
            | select(.ok == false)
          ]
          | length
          ' playwright-report/results.json)

          FLAKY=$(jq '
          [
            .suites[].suites[].specs[]
            | select(
                any(.tests[].results[]?; .status=="flaky")
              )
          ]
          | length
          ' playwright-report/results.json)

          SKIPPED=$(jq '
          [
            .suites[].suites[].specs[]
            | select(
                all(.tests[].results[]?; .status=="skipped")
              )
          ]
          | length
          ' playwright-report/results.json)

          TOTAL=$(jq '
          [
            .suites[].suites[].specs[]
          ]
          | length
          ' playwright-report/results.json)

          SUM=$((PASSED + FAILED + FLAKY + SKIPPED))

          echo "Passed : $PASSED"
          echo "Failed : $FAILED"
          echo "Flaky  : $FLAKY"
          echo "Skipped: $SKIPPED"
          echo "Total  : $TOTAL"
          echo "Sum    : $SUM"

          if [ "$TOTAL" -gt 0 ]; then
            PASS_RATE=$(awk "BEGIN { printf \"%.2f\", (($PASSED + $FLAKY)/$TOTAL)*100 }")
            FAILURE_RATE=$(awk "BEGIN { printf \"%.2f\", ($FAILED/$TOTAL)*100 }")
            FLAKY_RATE=$(awk "BEGIN { printf \"%.2f\", ($FLAKY/$TOTAL)*100 }")
            SKIPPED_RATE=$(awk "BEGIN { printf \"%.2f\", ($SKIPPED/$TOTAL)*100 }")
          else
            PASS_RATE=0
            FAILURE_RATE=0
            FLAKY_RATE=0
            SKIPPED_RATE=0
          fi

          echo "TOTAL_TESTS=$TOTAL" >> $GITHUB_ENV
          echo "PASSED_TESTS=$PASSED" >> $GITHUB_ENV
          echo "FAILED_TESTS=$FAILED" >> $GITHUB_ENV
          echo "FLAKY_TESTS=$FLAKY" >> $GITHUB_ENV
          echo "SKIPPED_TESTS=$SKIPPED" >> $GITHUB_ENV
          echo "PASS_RATE=$PASS_RATE" >> $GITHUB_ENV
          echo "FAILURE_RATE=$FAILURE_RATE" >> $GITHUB_ENV
          echo "FLAKY_RATE=$FLAKY_RATE" >> $GITHUB_ENV
          echo "SKIPPED_RATE=$SKIPPED_RATE" >> $GITHUB_ENV
          if [ "$TOTAL" -gt 0 ]; then
            QUALITY_SCORE=$(awk "BEGIN { printf \"%.0f\", (($PASSED + ($FLAKY*0.5))/$TOTAL)*100 }")
          else
            QUALITY_SCORE=0
          fi

          echo "QUALITY_SCORE=$QUALITY_SCORE" >> $GITHUB_ENV

      # - name: 🔍 Debug Specs
      #   if: always()
      #   run: |
      #     jq '
      #       .suites[].suites[]
      #       | {
      #           file,
      #           specs
      #         }
      #     ' playwright-report/results.json

      # - name: 🔍 Debug Playwright Structure
        # if: always()
        # run: |
        #   jq '
        #     ..
        #     | objects
        #     | select(has("file"))
        #     | {file,title,status}
        #   ' playwright-report/results.json | head -100

      # - name: 🔍 Debug Spec Summary
      #   if: always()
      #   run: |
      #     jq '
      #     .suites[].suites[].specs[]
      #     | {
      #         title,
      #         ok
      #       }
      #     ' playwright-report/results.json

      - name: 📋 Collect PR Details
        if: github.event_name == 'pull_request'
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "PR_TITLE=${{ github.event.pull_request.title }}" >> $GITHUB_ENV
          echo "PR_AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_ENV
          echo "PR_URL=${{ github.event.pull_request.html_url }}" >> $GITHUB_ENV
          echo "PR_BRANCH=${{ github.event.pull_request.head.ref }}" >> $GITHUB_ENV
          echo "PR_BASE_BRANCH=${{ github.event.pull_request.base.ref }}" >> $GITHUB_ENV
          echo "PR_LABELS=${{ join(github.event.pull_request.labels.*.name, ', ') }}" >> $GITHUB_ENV
          echo "PR_SHA=${{ join(github.event.pull_request.merge_commit_sha, ', ') }}" >> $GITHUB_ENV

      # - name: 🔍 Debug Playwright Report
      #   if: always()
      #   run: |
      #     echo "Checking report..."

      #     ls -R playwright-report || true

      #     if [ -f playwright-report/results.json ]; then
      #       echo "results.json exists"

      #       echo "===== FIRST 100 LINES ====="
      #       head -100 playwright-report/results.json

      #       echo "===== TEST STATUS ENTRIES ====="
      #       jq '.. | .status? // empty' playwright-report/results.json
            
      #     else
      #       echo "results.json NOT FOUND"
      #     fi

      # - name: 🔍 Find Outcome Structure
      #   if: always()
      #   run: |
      #     echo "===== SEARCH outcome ====="
      #     grep -n "outcome" playwright-report/results.json | head -20

      #     echo "===== SEARCH status ====="
      #     grep -n "status" playwright-report/results.json | head -20

      #     echo "===== SEARCH title ====="
      #     grep -n "title" playwright-report/results.json | head -20

      # - name: 🔍 Inspect Test Node
      #   if: always()
      #   run: |
      #     jq '
      #       ..
      #       | objects
      #       | select(has("title"))
      #       | {title,status,outcome}
      #     ' playwright-report/results.json | head -200

      # - name: 🔍 Debug Application Paths
      #   if: always()
      #   run: |
      #     jq -r '
      #     .suites[].suites[]
      #     | select(.file != null)
      #     | .file
      #     ' playwright-report/results.json

      - name: 📦 Build Breakdown Data
        id: breakdown
        if: always()
        run: |
          # ------- Application Name Mapping -------
          get_app_name() {
            case "$1" in
              expand-testing) echo "Expand Testing" ;;
              orange-hrm)     echo "Orange HRM" ;;
              qa-playground)  echo "QA Playground" ;;
              sauce-demo)     echo "SauceDemo" ;;
              *)              echo "$1" ;;
            esac
          }

          # ------- Get Health -------
          get_health() {
            local FAILED=$1
            local FLAKY=$2
            if [ "$FAILED" -gt 0 ]; then
              echo "🔴 Critical"
            elif [ "$FLAKY" -gt 0 ]; then
              echo "🟡 Unstable"
            else
              echo "🟢 Healthy"
            fi
          }

          # ------- Common Calculation -------
          calculate_metrics() {
            local TOTAL=$1
            local PASSED=$2
            local FAILED=$3
            local FLAKY=$4
            local SKIPPED=$5
            if [ "$TOTAL" -gt 0 ]; then
              HEALTH=$(get_health "$FAILED" "$FLAKY")
              PASS_RATE=$(awk "BEGIN { printf \"%.2f\", (($PASSED + $FLAKY)/$TOTAL)*100 }")
              FAIL_RATE=$(awk "BEGIN { printf \"%.2f\", ($FAILED/$TOTAL)*100 }")
              FLAKY_RATE=$(awk "BEGIN { printf \"%.2f\", ($FLAKY/$TOTAL)*100 }")
              SKIP_RATE=$(awk "BEGIN { printf \"%.2f\", ($SKIPPED/$TOTAL)*100 }")
              QUALITY_SCORE=$(awk "BEGIN {
                printf \"%.0f\",
                (($PASSED + ($FLAKY * 0.5))/$TOTAL)*100
              }")
            else
              HEALTH=$(get_health "$FAILED" "$FLAKY")
              PASS_RATE=0
              FAIL_RATE=0
              FLAKY_RATE=0
              SKIP_RATE=0
              QUALITY_SCORE=0
            fi
          }

          # ------- Table header for Application Health Dashboard -------
          echo "| Application | Total | Passed | Failed | Flaky | Skipped | Pass Rate | Fail Rate | Flaky Rate | Skipped Rate | Quality Score | Health |" > application-health-dashboard.md
          echo "|:-------------:|:--------:|:--------:|:--------:|:--------:|:--------:|:-----------:|:-----------:|:------------:|:-----------:|:-----------:|:-----------:|" >> application-health-dashboard.md

          # ------- Table header for Module Breakdown -------
          echo "| Application | Module | Total | Passed | Failed | Flaky | Skipped | Pass Rate | Fail Rate | Flaky Rate | Skipped Rate | Quality Score | Health |" > module-breakdown.md
          echo "|:-------------:|:-------------:|:--------:|:--------:|:--------:|:--------:|:---------:|:-----------:|:-----------:|:------------:|:--------------:|:---------------:|:-----------:|" >> module-breakdown.md

          # ------- Table header for Tag Execution Summary -------
          echo "| Tag | Total | Passed | Failed | Flaky | Skipped | Pass Rate | Fail Rate | Flaky Rate | Skipped Rate | Quality Score | Health |" > tag-execution-summary.md
          echo "|:-------------:|:--------:|:--------:|:--------:|:--------:|:---------:|:-----------:|:-----------:|:------------:|:--------------:|:---------------:|:-----------:|" >> tag-execution-summary.md

          # ------- Application Health Dashboard -------
          jq -r '
          .suites[].suites[]
          | select(.file != null)
          | [
              (.file | split("/")[0]),
              (.specs | length),

              ([.specs[]
                | select(.ok == true)
                | select(
                    any(.tests[].results[]?; .status=="flaky") | not
                  )
              ] | length),

              ([.specs[]
                | select(.ok == false)
              ] | length),

              ([.specs[]
                | select(
                    any(.tests[].results[]?; .status=="flaky")
                  )
              ] | length),

              ([.specs[]
                | select(
                    all(.tests[].results[]?; .status=="skipped")
                  )
              ] | length)
          ]
          | @tsv
          ' playwright-report/results.json |
          awk -F'\t' '
          {
              total[$1] += $2
              passed[$1] += $3
              failed[$1] += $4
              flaky[$1] += $5
              skipped[$1] += $6
          }
          END {
              for (app in total)
                  print app "\t" total[app] "\t" passed[app] "\t" failed[app] "\t" flaky[app] "\t" skipped[app]
          }' |
          while IFS=$'\t' read -r APP TOTAL PASSED FAILED FLAKY SKIPPED
          do
            APP_NAME=$(get_app_name "$APP")
            if [ "$TOTAL" -gt 0 ]; then
              calculate_metrics \
                "$TOTAL" \
                "$PASSED" \
                "$FAILED" \
                "$FLAKY" \
                "$SKIPPED"
            else
              PASS_RATE=0
              FAIL_RATE=0
              FLAKY_RATE=0
              SKIP_RATE=0
              QUALITY_SCORE=0
            fi
            echo "| $APP_NAME | $TOTAL | $PASSED | $FAILED | $FLAKY | $SKIPPED | ${PASS_RATE}% | ${FAIL_RATE}% | ${FLAKY_RATE}% | ${SKIP_RATE}% | ${QUALITY_SCORE}% | $HEALTH |" >> application-health-dashboard.md
          done

          # ------- Module Breakdown -------
          jq -r '
          .suites[].suites[]
          | select(.file != null)
          | [
              (.file | split("/")[0]),
              (.file | split("/")[1] | sub("\\.spec\\.js$"; "")),
              (.specs | length),

              ([.specs[]
                | select(.ok == true)
                | select(
                    any(.tests[].results[]?; .status=="flaky") | not
                )
              ] | length),

              ([.specs[]
                | select(.ok == false)
              ] | length),

              ([.specs[]
                | select(
                    any(.tests[].results[]?; .status=="flaky")
                )
              ] | length),

              ([.specs[]
                | select(
                    all(.tests[].results[]?; .status=="skipped")
                )
              ] | length)
          ]
          | @tsv
          ' playwright-report/results.json |
          while IFS=$'\t' read -r APP MODULE TOTAL PASSED FAILED FLAKY SKIPPED
          do
            APP_NAME=$(get_app_name "$APP")
            if [ "$TOTAL" -gt 0 ]; then
              calculate_metrics \
                "$TOTAL" \
                "$PASSED" \
                "$FAILED" \
                "$FLAKY" \
                "$SKIPPED"
            else
              PASS_RATE=0
              FAIL_RATE=0
              FLAKY_RATE=0
              SKIP_RATE=0
              QUALITY_SCORE=0
            fi
            echo "| $APP_NAME | $MODULE | $TOTAL | $PASSED | $FAILED | $FLAKY | $SKIPPED | ${PASS_RATE}% | ${FAIL_RATE}% | ${FLAKY_RATE}% | ${SKIP_RATE}% | ${QUALITY_SCORE}% | $HEALTH |" >> module-breakdown.md
          done

          # ------- Tag Execution Summary -------
          # Excluded tag
          EXCLUDED_TAGS="sauce-demo orange-hrm"

          # Untagged test case
          : > untagged-test-cases.txt

          # Extract test cases without valid tags.
          jq -r '
            def all_specs($file):
              . as $suite |
              (
                $suite.specs[]? |
                {
                  spec: .,
                  file: ($suite.file // $file // "Unknown file")
                }
              ),
              (
                $suite.suites[]? |
                all_specs($suite.file // $file)
              );

            .suites[]? |
            all_specs("")
            | . as $item
            | $item.spec as $spec
            | [
                (($spec.tags // [])[]),
                (($spec.tests // [])[]?.tags // [])[]
              ]
            | map(tostring | sub("^@"; ""))
            | unique
            | map(select(
                (ascii_downcase != "sauce-demo") and
                (ascii_downcase != "orange-hrm")
              ))
            | select(length == 0)
            | "\($item.spec.title // "Untitled test case")\t\($item.file)"
          ' playwright-report/results.json > untagged-test-cases.txt

          # Extract valid tags and their test case statuses.
          jq -r '
            def all_specs($file):
              . as $suite |
              (
                $suite.specs[]? |
                {
                  spec: .,
                  file: ($suite.file // $file // "Unknown file")
                }
              ),
              (
                $suite.suites[]? |
                all_specs($suite.file // $file)
              );

            .suites[]? |
            all_specs("")
            | .spec as $spec
            | [
                (($spec.tags // [])[]),
                (($spec.tests // [])[]?.tags // [])[]
              ]
            | map(tostring | sub("^@"; ""))
            | unique
            | map(select(
                (ascii_downcase != "sauce-demo") and
                (ascii_downcase != "orange-hrm")
              ))
            | . as $tags
            | (
                [$spec.tests[]?.results[]?] as $results
                | if (($results | length) > 0 and
                      all($results[]; .status == "skipped")) then
                    "skipped"
                  elif $spec.ok == false then
                    "failed"
                  elif any($results[]?; .status == "flaky") then
                    "flaky"
                  else
                    "passed"
                  end
              ) as $status
            | $tags[]
            | "\(.)\t\($status)"
          ' playwright-report/results.json |
          awk -F'\t' '
          {
            total[$1]++
            status[$1, $2]++
          }
          END {
            for (tag in total) {
              print tag "\t" total[tag] \
                "\t" status[tag, "passed"]+0 \
                "\t" status[tag, "failed"]+0 \
                "\t" status[tag, "flaky"]+0 \
                "\t" status[tag, "skipped"]+0
            }
          }' |
          sort -k1,1 |
          while IFS=$'\t' read -r TAG TOTAL PASSED FAILED FLAKY SKIPPED
          do
            calculate_metrics \
              "$TOTAL" \
              "$PASSED" \
              "$FAILED" \
              "$FLAKY" \
              "$SKIPPED"

            echo "| @$TAG | $TOTAL | $PASSED | $FAILED | $FLAKY | $SKIPPED | ${PASS_RATE}% | ${FAIL_RATE}% | ${FLAKY_RATE}% | ${SKIP_RATE}% | ${QUALITY_SCORE}% | $HEALTH |" >> tag-execution-summary.md
          done

          # Add untagged test case details to the Markdown report.
          UNTAGGED_COUNT=$(wc -l < untagged-test-cases.txt | tr -d ' ')
          {
            echo ""
            echo "### ⚠️ Test Cases Without Tags"
            echo ""
            echo "**Total Untagged Test Cases: $UNTAGGED_COUNT**"
            echo ""

            if [ "$UNTAGGED_COUNT" -gt 0 ]; then
              awk -F'\t' '{
                printf "%d. **%s** — `%s`\n", NR, $1, $2
              }' untagged-test-cases.txt
            else
              echo "All test cases have valid tags."
            fi
          } >> tag-execution-summary.md

          # ------- Generate Slack formatted text -------
          node <<'NODE'
          const fs = require('fs');
          function readTable(file) {
            return fs.readFileSync(file, 'utf8')
              .split(/\r?\n/)
              .filter(line => line.trim().startsWith('|'))
              .filter(line => !/^\|[\s|:-]+\|$/.test(line.trim()))
              .map(line => line.trim()
                .replace(/^\|/, '')
                .replace(/\|$/, '')
                .split('|')
                .map(cell => cell.trim())
              );
          }

          // Application Health Dashboard
          const appRows = readTable('application-health-dashboard.md');
          const appText = appRows.slice(1).map(row =>
            `• *${row[0]}* — Total: ${row[1]} | Passed: ${row[2]} | Failed: ${row[3]} | Flaky: ${row[4]} | Skipped: ${row[5]} | Pass Rate: ${row[6]} | Fail Rate: ${row[7]} | Flaky Rate: ${row[8]} | Skipped Rate: ${row[9]} | Quality Score: ${row[10]} | Health: ${row[11]}`
          ).join('\n');
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `APPLICATION_HEALTH_TEXT=${JSON.stringify(appText)}\n`
          );

          // Module Breakdown grouped by Application
          const moduleRows = readTable('module-breakdown.md').slice(1);
          const grouped = {};
          for (const row of moduleRows) {
            const [
              application,
              module,
              total,
              passed,
              failed,
              flaky,
              skipped,
              passRate,
              failRate,
              flakyRate,
              skippedRate,
              qualityScore,
              health
            ] = row;
            if (!grouped[application]) {
              grouped[application] = [];
            }
            grouped[application].push(
              `   • *${module}* — Total: ${total} | Passed: ${passed} | Failed: ${failed} | Flaky: ${flaky} | Skipped: ${skipped} | Pass Rate: ${passRate} | Fail Rate: ${failRate} | Flaky Rate: ${flakyRate} | Skipped Rate: ${skippedRate} | Quality Score: ${qualityScore} | Health: ${health}`
            );
          }

          // Build grouped module text
          const moduleText = Object.entries(grouped)
            .map(([application, modules]) =>
              `🧩 *${application}*\n${modules.join('\n')}`
            )
            .join('\n\n');
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `MODULE_BREAKDOWN_TEXT=${JSON.stringify(moduleText)}\n`
          );

          // Tag Execution Summary
          const tagRows = readTable('tag-execution-summary.md');
          const tagText = tagRows.slice(1)
            .filter(row => row.length >= 12)
            .map(row =>
              `• *@${row[0].replace(/^@/, '')}* — Total: ${row[1]} | Passed: ${row[2]} | Failed: ${row[3]} | Flaky: ${row[4]} | Skipped: ${row[5]} | Pass Rate: ${row[6]} | Fail Rate: ${row[7]} | Flaky Rate: ${row[8]} | Skipped Rate: ${row[9]} | Quality Score: ${row[10]} | Health: ${row[11]}`
            )
            .join('\n');
          const untaggedLines = fs.existsSync('untagged-test-cases.txt')
            ? fs.readFileSync('untagged-test-cases.txt', 'utf8')
                .split(/\r?\n/)
                .filter(Boolean)
            : [];
          const untaggedText = untaggedLines.length
            ? untaggedLines.slice(0, 15).map((line, index) => {
                const [title, file] = line.split('\t');
                return `${index + 1}. *${title}* — \`${file}\``;
              }).join('\n') +
              (untaggedLines.length > 15
                ? `\n…and ${untaggedLines.length - 15} more.`
                : '')
            : 'All test cases have valid tags.';
          const tagExecutionText = [
            tagText || 'No tagged tests found.',
            '',
            `⚠️ *Test Cases Without Tags: ${untaggedLines.length}*`,
            untaggedText
          ].join('\n');
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `TAG_EXECUTION_TEXT=${JSON.stringify(tagExecutionText)}\n`
          );
          NODE

      - name: 📊 Generate Failure, Flakiness, Risk & Performance Reports
        id: generate_failure_flakiness_risk_performance_report
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const reportPath = 'playwright-report/results.json';
          const report = fs.existsSync(reportPath)
            ? JSON.parse(fs.readFileSync(reportPath, 'utf8'))
            : { suites: [] };

          // ------- Initialize Test Result Collections -------
          const failedTests = [];
          const flakyTests = [];
          const failedModuleCounts = {};
          const moduleRiskCounts = {};

          // ------- Application Name Mapping -------
          function getAppName(name) {
            const applications = {
              'expand-testing': 'Expand Testing',
              'orange-hrm': 'Orange HRM',
              'qa-playground': 'QA Playground',
              'sauce-demo': 'SauceDemo'
            };
            return applications[name] || name;
          }

          // ------- Markdown Formatting Utilities -------
          function escapeMarkdown(value) {
            return String(value || 'N/A')
              .replace(/\|/g, '\\|')
              .replace(/\r?\n/g, ' ')
              .trim();
          }

          // ------- Collect Test Results & Aggregate Module Metrics -------
          function walk(suites, parentFile = '') {
            for (const suite of suites || []) {
              const file = suite.file || parentFile || 'Unknown';

              for (const spec of suite.specs || []) {
                const specFile = spec.file || file;
                const parts = specFile.replace(/\\/g, '/').split('/');

                const app = parts[0] || 'Unknown';
                const module = (parts[1] || 'Unknown')
                  .replace(/\.spec\.(js|ts)$/, '');

                const appName = getAppName(app);
                const tests = spec.tests || [];

                // Aggregate Module Test Metrics
                const key = `${appName}::${module}`;
                moduleRiskCounts[key] = moduleRiskCounts[key] || {
                  application: appName,
                  module,
                  total: 0,
                  executed: 0,
                  failed: 0,
                  flaky: 0,
                  durationMs: 0,
                  durationTestCount: 0
                };
                const riskItem = moduleRiskCounts[key];
                for (const test of tests) {
                  // Count every test entry, including passed and skipped.
                  riskItem.total++;

                  // Collect execution duration, including retry attempts.
                  const results = test.results || [];
                  const testDurationMs = results.reduce(
                    (total, result) => total + (Number(result.duration) || 0),
                    0
                  );
                  riskItem.durationMs += testDurationMs;
                  if (results.length > 0) {
                    riskItem.durationTestCount++;
                  }

                  // Exclude skipped tests from risk-rate calculations.
                  if (test.status !== 'skipped') {
                    riskItem.executed++;
                  }

                  // Separate Failed from Flaky
                  const isFailed = test.status === 'unexpected';
                  const isFlaky = test.status === 'flaky';
                  if (isFailed) {
                    riskItem.failed++;
                  }
                  if (isFlaky) {
                    riskItem.flaky++;
                  }

                  // Only collect detailed information for failed/flaky tests.
                  if (!isFailed && !isFlaky) continue;
                  const testTitle = test.title || spec.title || 'Untitled test';
                  const project = test.projectName || 'Default';
                  const lastResult = results.at(-1) || {};
                  const error =
                    lastResult.error?.message ||
                    lastResult.errors?.[0]?.message ||
                    'No error details available';
                  const testDetails = {
                    application: appName,
                    module,
                    title: testTitle,
                    project,
                    error,
                    retries: Math.max(0, results.length - 1)
                  };

                  // Collect Flaky Tests
                  if (isFlaky) {
                    flakyTests.push(testDetails);
                    continue;
                  }

                  // Collect Failed Tests
                  if (isFailed) {
                    failedModuleCounts[key] = failedModuleCounts[key] || {
                      application: appName,
                      module,
                      count: 0
                    };
                    failedModuleCounts[key].count++;
                    failedTests.push(testDetails);
                  }
                }
              }

              // Continue traversing nested suites.
              walk(suite.suites, file);
            }
          }
          walk(report.suites || []);

          // ------- Slowest Module Analysis -------
          const slowestModules = Object.values(moduleRiskCounts)
            .filter(item => item.durationMs > 0)
            .map(item => ({
              ...item,
              averageDurationMs: item.durationTestCount > 0
                ? item.durationMs / item.durationTestCount
                : 0
            }))
            .sort((a, b) =>
              b.durationMs - a.durationMs ||
              b.averageDurationMs - a.averageDurationMs ||
              a.application.localeCompare(b.application) ||
              a.module.localeCompare(b.module)
            );

          // Get the single slowest module
          const slowestModule = slowestModules[0] || null;

          // Format milliseconds into readable seconds
          function formatDuration(ms) {
            return `${(ms / 1000).toFixed(2)}s`;
          }

          // Slowest Module Log
          console.log('Slowest Module Analysis:');
          if (slowestModule) {
            console.log(
              `Slowest Module: ${slowestModule.application} / ${slowestModule.module}`
            );
            console.log(
              `Total Duration: ${formatDuration(slowestModule.durationMs)}`
            );
            console.log(
              `Average Duration: ${formatDuration(slowestModule.averageDurationMs)}`
            );
          } else {
            console.log('No execution duration data found.');
          }

          // ------- Module Risk Analysis -------
          const riskModules = Object.values(moduleRiskCounts).map(item => {

            // Calculate Failure Rate
            const failureRate = item.executed > 0
              ? (item.failed / item.executed) * 100
              : 0;

            // Calculate Flaky Rate
            const flakyRate = item.executed > 0
              ? (item.flaky / item.executed) * 100
              : 0;

            // Calculate Weighted Risk Score
            const riskScore = Math.min(
              100,
              (failureRate * 0.70) + (flakyRate * 0.30)
            );

            // Assign Risk Level
            let riskLevel = '🟢 Healthy';
            if (riskScore >= 50) {
              riskLevel = '🔴 Critical';
            } else if (riskScore >= 25) {
              riskLevel = '🟠 High';
            } else if (riskScore >= 10) {
              riskLevel = '🟡 Moderate';
            } else if (riskScore > 0) {
              riskLevel = '🔵 Low';
            }

            return {
              ...item,
              failureRate,
              flakyRate,
              riskScore,
              riskLevel
            };
          });

          // ------- Rank Modules by Risk -------
          riskModules.sort((a, b) =>
            b.riskScore - a.riskScore ||
            b.failed - a.failed ||
            b.flaky - a.flaky ||
            a.application.localeCompare(b.application) ||
            a.module.localeCompare(b.module)
          );

          // Get Top 10 Highest-Risk Modules
          const topRiskModules = riskModules.slice(0, 10);

          // Get the single highest-risk module
          const topRiskModule = topRiskModules[0] || null;

          // ------- Risk Summary Metrics -------
          const totalModulesAnalyzed = riskModules.length;
          const highRiskModuleCount = riskModules.filter(
            item => item.riskScore >= 25
          ).length;
          const criticalRiskModuleCount = riskModules.filter(
            item => item.riskScore >= 50
          ).length;

          console.log('Module Risk Analysis:');
          console.log(`Total Modules: ${totalModulesAnalyzed}`);
          console.log(`High/Critical Risk Modules: ${highRiskModuleCount}`);
          console.log(`Critical Risk Modules: ${criticalRiskModuleCount}`);

          // ------- Generate Failed Modules Report -------
          const modules = Object.values(failedModuleCounts)
            .sort((a, b) =>
              a.application.localeCompare(b.application) ||
              a.module.localeCompare(b.module)
            );

          // Failed Modules Table
          const failedModuleMarkdown = [
            '| Application | Module | Failed Tests |',
            '|:-------------:|:--------:|:-------------:|',
            ...(modules.length
              ? modules.map(item =>
                  `| ${escapeMarkdown(item.application)} | ${escapeMarkdown(item.module)} | ${item.count} |`
                )
              : ['| N/A | No failed modules | 0 |'])
          ].join('\n');

          // Save Markdown report
          fs.writeFileSync(
            'failed-modules.md',
            failedModuleMarkdown + '\n'
          );

          // ------- Failed Tests Table -------
          const failedTestMarkdown = [
            '| Application | Module | Test Case | Project | Retries |',
            '|:-------------:|:--------:|:-----------:|:---------:|:--------:|',
            ...(failedTests.length
              ? failedTests.map(test =>
                  `| ${escapeMarkdown(test.application)} | ${escapeMarkdown(test.module)} | ${escapeMarkdown(test.title)} | ${escapeMarkdown(test.project)} | ${test.retries} |`
                )
              : ['| N/A | N/A | No failed tests | N/A | 0 |'])
          ].join('\n');

          // Save Markdown report
          fs.writeFileSync(
            'failed-tests.md',
            failedTestMarkdown + '\n'
          );

          // ------- Flaky Tests Table -------
          const flakyTestMarkdown = [
            '| Application | Module | Test Case | Project | Retries |',
            '|:-------------:|:--------:|:-----------:|:---------:|:--------:|',
            ...(flakyTests.length
              ? flakyTests.map(test =>
                  `| ${escapeMarkdown(test.application)} | ${escapeMarkdown(test.module)} | ${escapeMarkdown(test.title)} | ${escapeMarkdown(test.project)} | ${test.retries} |`
                )
              : ['| N/A | N/A | No flaky tests | N/A | 0 |'])
          ].join('\n');

          // Save Markdown report
          fs.writeFileSync(
            'flaky-tests.md',
            flakyTestMarkdown + '\n'
          );
          
          // ------- Top Risk Modules Report -------
          const topRiskMarkdown = [
            '',
            '> Application modules ranked by weighted failure and flaky rates.',
            '',
            '### 📊 Risk Overview',
            '',
            `| Metric | Value |`,
            `|:---:|:---:|`,
            `| Total Modules Analyzed | ${totalModulesAnalyzed} |`,
            `| Modules Ranked | ${topRiskModules.length} |`,
            `| High/Critical Risk Modules | ${highRiskModuleCount} |`,
            `| Critical Risk Modules | ${criticalRiskModuleCount} |`,
            '',
            '### 🏆 Top 10 Highest-Risk Modules',
            '',
            '| Rank | Application | Module | Total | Executed | Failed | Flaky | Failure Rate | Flaky Rate | Risk Score | Risk Level |',
            '|:---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|',

            ...(topRiskModules.length
              ? topRiskModules.map((item, index) =>
                  `| #${index + 1} | ${escapeMarkdown(item.application)} | ${escapeMarkdown(item.module)} | ${item.total} | ${item.executed} | ${item.failed} | ${item.flaky} | ${item.failureRate.toFixed(2)}% | ${item.flakyRate.toFixed(2)}% | ${item.riskScore.toFixed(2)}% | ${item.riskLevel} |`
                )
              : [
                  '| - | N/A | No modules found | 0 | 0 | 0 | 0 | 0.00% | 0.00% | 0.00% | 🟢 Healthy |'
                ]),

            '',
            '#### 🧮 Risk Score Calculation',
            '',
            '**Risk Score = (Failure Rate × 70%) + (Flaky Rate × 30%)**',
            '',
            '- Failure Rate = (Failed Tests / Executed Tests) × 100',
            '- Flaky Rate = (Flaky Tests / Executed Tests) × 100',
            '- Skipped tests are excluded from the rate denominator.',
            '- Maximum risk score is capped at 100%.',
            '',
            '_Only the top 10 highest-risk modules are displayed._'
          ].join('\n');

          // Save Markdown report
          fs.writeFileSync(
            'top-risk-modules.md',
            topRiskMarkdown + '\n'
          );

          // ------- Slowest Module Table -------
          const slowestModuleMarkdown = [
            '',
            ...(slowestModule
              ? [
                  '| Application | Module | Total Duration | Average Duration | Tests Measured |',
                  '|:---:|:---:|:---:|:---:|:---:|',
                  `| ${escapeMarkdown(slowestModule.application)} | ${escapeMarkdown(slowestModule.module)} | ${formatDuration(slowestModule.durationMs)} | ${formatDuration(slowestModule.averageDurationMs)} | ${slowestModule.durationTestCount} |`
                ]
              : [
                  'No execution duration data available.'
                ])
          ].join('\n');

          // Save Markdown report
          fs.writeFileSync(
            'slowest-module.md',
            slowestModuleMarkdown + '\n'
          );

          // ------- Generate Release Readiness Report -------
          const RELEASE_READINESS_CONFIG = {
            failureRateThreshold: 5,       // NO-GO when failure rate exceeds 5%
            flakyRateThreshold: 5,         // 5% flaky rate reaches zero flaky score
            slowTestThresholdMs: 10000,    // 10 seconds average duration per test
            weights: {
              passRate: 40,
              failureRate: 25,
              flakyRate: 15,
              moduleRisk: 10,
              performance: 10
            },
            decisions: {
              go: 90,
              conditionalGo: 75
            }
          };

          // Aggregate module execution metrics
          const readinessMetrics = Object.values(moduleRiskCounts).reduce(
            (totals, module) => {
              totals.total += module.total || 0;
              totals.executed += module.executed || 0;
              totals.failed += module.failed || 0;
              totals.flaky += module.flaky || 0;
              return totals;
            },
            {
              total: 0,
              executed: 0,
              failed: 0,
              flaky: 0
            }
          );
          const {
            total,
            executed,
            failed,
            flaky
          } = readinessMetrics;

          // Note: A flaky test is counted separately from a fully passing test
          const passed = Math.max(0, executed - failed - flaky);
          const failureRate = executed > 0
            ? (failed / executed) * 100
            : 0;
          const flakyRate = executed > 0
            ? (flaky / executed) * 100
            : 0;
          const passRate = executed > 0
            ? (passed / executed) * 100
            : 0;

          // Highest module risk score
          const highestModuleRisk = riskModules.length > 0
            ? Math.max(...riskModules.map(module => module.riskScore))
            : 0;

          // Slowest module's average test duration
          const averageTestDurationMs = slowestModule
            ? slowestModule.averageDurationMs
            : 0;

          // Calculate individual weighted scores
          const passRateScore =
            (passRate / 100) *
            RELEASE_READINESS_CONFIG.weights.passRate;
          const failureRateScore =
            Math.max(0, 100 - failureRate) / 100 *
            RELEASE_READINESS_CONFIG.weights.failureRate;
          const flakyRateScore =
            Math.max(
              0,
              100 - (
                flakyRate /
                RELEASE_READINESS_CONFIG.flakyRateThreshold
              ) * 100
            ) / 100 *
            RELEASE_READINESS_CONFIG.weights.flakyRate;
          const moduleRiskScore =
            Math.max(0, 100 - highestModuleRisk) / 100 *
            RELEASE_READINESS_CONFIG.weights.moduleRisk;
          const performanceScore =
            Math.max(
              0,
              100 - (
                averageTestDurationMs /
                RELEASE_READINESS_CONFIG.slowTestThresholdMs
              ) * 100
            ) / 100 *
            RELEASE_READINESS_CONFIG.weights.performance;
          const readinessScore = Number((
            passRateScore +
            failureRateScore +
            flakyRateScore +
            moduleRiskScore +
            performanceScore
          ).toFixed(2));

          // Determine release readiness
          let readinessStatus;
          let readinessReason;
          if (executed === 0) {
            readinessStatus = 'NO-GO';
            readinessReason = 'No executed tests were found.';
          } else if (
            failureRate >
            RELEASE_READINESS_CONFIG.failureRateThreshold
          ) {
            readinessStatus = 'NO-GO';
            readinessReason =
              `Failure rate (${failureRate.toFixed(2)}%) exceeds ` +
              `the ${RELEASE_READINESS_CONFIG.failureRateThreshold}% threshold.`;
          } else if (
            readinessScore >= RELEASE_READINESS_CONFIG.decisions.go &&
            failed === 0
          ) {
            readinessStatus = 'GO';
            readinessReason =
              'All readiness scoring criteria are satisfied.';
          } else if (
            readinessScore >= RELEASE_READINESS_CONFIG.decisions.conditionalGo
          ) {
            readinessStatus = 'CONDITIONAL GO';
            readinessReason =
              'Review outstanding test failures, flaky tests, or risk areas.';
          } else {
            readinessStatus = 'NO-GO';
            readinessReason =
              'The readiness score is below the minimum release threshold.';
          }

          // Final readiness result
          const releaseReadiness = {
            status: readinessStatus,
            score: readinessScore,
            reason: readinessReason,
            metrics: {
              totalTests: total,
              executedTests: executed,
              passedTests: passed,
              failedTests: failed,
              flakyTests: flaky,
              passRate: Number(passRate.toFixed(2)),
              failureRate: Number(failureRate.toFixed(2)),
              flakyRate: Number(flakyRate.toFixed(2)),
              highestModuleRisk: Number(highestModuleRisk.toFixed(2)),
              averageTestDurationMs: Number(
                averageTestDurationMs.toFixed(2)
              )
            },
            componentScores: {
              passRate: Number(passRateScore.toFixed(2)),
              failureRate: Number(failureRateScore.toFixed(2)),
              flakyRate: Number(flakyRateScore.toFixed(2)),
              moduleRisk: Number(moduleRiskScore.toFixed(2)),
              performance: Number(performanceScore.toFixed(2))
            },
            thresholds: RELEASE_READINESS_CONFIG
          };

          // Release Readiness Report
          const readinessStatusEmoji = {
            'GO': '🟢',
            'CONDITIONAL GO': '🟡',
            'NO-GO': '🔴'
          }[releaseReadiness.status] || '⚪';
          const readinessMarkdown = `### ${readinessStatusEmoji} ${releaseReadiness.status}
          *Readiness Score:* ${releaseReadiness.score}/100
          ${releaseReadiness.reason}
          ### Scoring Breakdown
          | Category | Weight | Score |
          |:---:|:---:|:---:|
          | Test Pass Rate | ${RELEASE_READINESS_CONFIG.weights.passRate}% | ${passRateScore.toFixed(2)} |
          | Failure Rate | ${RELEASE_READINESS_CONFIG.weights.failureRate}% | ${failureRateScore.toFixed(2)} |
          | Flaky Rate | ${RELEASE_READINESS_CONFIG.weights.flakyRate}% | ${flakyRateScore.toFixed(2)} |
          | Module Risk | ${RELEASE_READINESS_CONFIG.weights.moduleRisk}% | ${moduleRiskScore.toFixed(2)} |
          | Performance | ${RELEASE_READINESS_CONFIG.weights.performance}% | ${performanceScore.toFixed(2)} |
          | **Total** | **100%** | **${readinessScore.toFixed(2)}/100** |
          `;

          // Save Markdown report
          fs.writeFileSync(
            'release-readiness.md',
            readinessMarkdown,
            'utf8'
          );

          // Save structured JSON report
          fs.writeFileSync(
            'release-readiness.json',
            JSON.stringify(releaseReadiness, null, 2),
            'utf8'
          );

          // ------- Prepare Slack: Failed Modules -------
          const groupedModules = {};
          for (const item of modules) {
            groupedModules[item.application] =
              groupedModules[item.application] || [];

            groupedModules[item.application].push(
              `   • \`${item.module}\` — ${item.count} failed test${item.count === 1 ? '' : 's'}`
            );
          }
          const failedModulesSlack = modules.length
            ? Object.entries(groupedModules)
                .map(([application, items]) =>
                  `• *${application}*\n${items.join('\n')}`
                )
                .join('\n\n')
            : 'No failed modules.';

          // ------- Prepare Slack: Failed Tests -------
          const failedTestsSlack = failedTests.length
            ? failedTests.slice(0, 10).map(test =>
                `• *${test.application} / ${test.module}*\n   - ${test.title}`
              ).join('\n')
              + (failedTests.length > 10
                ? `\n…and ${failedTests.length - 10} more failed tests.`
                : '')
            : 'No failed tests.';

          // ------- Prepare Slack: Flaky Tests -------
          const flakyTestsSlack = flakyTests.length
            ? flakyTests.slice(0, 10).map(test =>
                `• *${test.application} / ${test.module}*\n   - ${test.title} (Retries: ${test.retries})`
              ).join('\n')
              + (flakyTests.length > 10
                ? `\n…and ${flakyTests.length - 10} more flaky tests.`
                : '')
            : 'No flaky tests.';

          // ------- Prepare Slack: Top Risk Module -------
          const topRiskModuleSlack = topRiskModule
            ? [
                `🚩 *${topRiskModule.application} / ${topRiskModule.module}*`,
                `• Failed: ${topRiskModule.failed}`,
                `• Flaky: ${topRiskModule.flaky}`,
                `• Failure Rate: ${topRiskModule.failureRate.toFixed(2)}%`,
                `• Flaky Rate: ${topRiskModule.flakyRate.toFixed(2)}%`,
                `• Risk Score: *${topRiskModule.riskScore.toFixed(2)}%*`,
                `• Risk Level: ${topRiskModule.riskLevel}`
              ].join('\n')
            : 'No modules found.';

          // ------- Prepare Slack: Slowest Module -------
          const slowestModuleSlack = slowestModule
            ? [
                `🐢 *${slowestModule.application} / ${slowestModule.module}*`,
                `• Total Duration: *${formatDuration(slowestModule.durationMs)}*`,
                `• Average Duration: ${formatDuration(slowestModule.averageDurationMs)}`,
                `• Tests Measured: ${slowestModule.durationTestCount}`,
                `• Failed: ${slowestModule.failed}`,
                `• Flaky: ${slowestModule.flaky}`
              ].join('\n')
            : 'No execution duration data available.';

          // ------- Prepare Slack: Release Readiness -------
          const releaseReadinessSlack = [
            `${readinessStatusEmoji} *${releaseReadiness.status}*`,
            `*Reason:* ${releaseReadiness.reason}`,
            `*Readiness Score:* ${releaseReadiness.score}/100`,
            `• Test Pass Rate: ${RELEASE_READINESS_CONFIG.weights.passRate}% , ${passRateScore.toFixed(2)}`,
            `• Failure Rate: ${RELEASE_READINESS_CONFIG.weights.failureRate}% , ${failureRateScore.toFixed(2)}`,
            `• Flaky Rate: ${RELEASE_READINESS_CONFIG.weights.flakyRate}% , ${flakyRateScore.toFixed(2)}`,
            `• Module Risk: ${RELEASE_READINESS_CONFIG.weights.moduleRisk}% , {moduleRiskScore.toFixed(2)}`,
            `• Performance: ${RELEASE_READINESS_CONFIG.weights.performance}% , ${performanceScore.toFixed(2)}`,
            `• Total: 100% , ${readinessScore.toFixed(2)}/100`
          ].join('\n');

          // ------- Export GitHub Actions Outputs -------
          function setOutput(name, value) {
            const delimiter = `EOF_${name}`;
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `${name}<<${delimiter}\n${value}\n${delimiter}\n`
            );
          }
          
          // Markdown
          // setOutput('TOP_RISK_MARKDOWN', topRiskMarkdown);
          // setOutput('TOP_RISK_MARKDOWN', topRiskMarkdown);
          // setOutput('FAILED_MODULES_MARKDOWN', failedModuleMarkdown);
          // setOutput('FAILED_TESTS_MARKDOWN', failedTestMarkdown);
          // setOutput('FLAKY_TESTS_MARKDOWN', flakyTestMarkdown);
          // setOutput('SLOWEST_MODULE_MARKDOWN', slowestModuleMarkdown);

          // Slack
          setOutput('RELEASE_READINESS_TEXT', releaseReadinessSlack);
          setOutput('TOP_RISK_MODULE_TEXT', topRiskModuleSlack);
          setOutput('FAILED_MODULE_TEXT', failedModulesSlack);
          setOutput('FAILED_TEST_TEXT', failedTestsSlack);
          setOutput('FLAKY_TEST_TEXT', flakyTestsSlack);
          setOutput('SLOWEST_MODULE_TEXT', slowestModuleSlack);

          // Release Readiness outputs
          setOutput('RELEASE_READINESS_STATUS', releaseReadiness.status);
          setOutput('RELEASE_READINESS_SCORE', String(releaseReadiness.score));
          setOutput('RELEASE_READINESS_REASON', releaseReadiness.reason);
          setOutput('RELEASE_READINESS_JSON', JSON.stringify(releaseReadiness, null, 2));

          // Logs
          console.log(`Failed modules: ${modules.length}`);
          console.log(`Failed tests: ${failedTests.length}`);
          console.log(`Flaky tests: ${flakyTests.length}`);
          NODE

