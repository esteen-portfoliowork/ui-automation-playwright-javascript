name: 🎭 Playwright Validation

run-name: >
  ${{
    github.event_name == 'workflow_dispatch'
    && format('🎭 Manual Validation | {0} | {1}', github.event.inputs.environment, github.event.inputs.browser)
    || github.event_name == 'pull_request'
    && format('✅ PR #{0} | {1}', github.event.pull_request.number, github.head_ref)
    || format('✅ Push Validation #{0}', github.run_number)
  }}

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main') }}

env:
  TEST_ENV: ${{ github.event.inputs.environment || 'qa' }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # Manual Trigger
  workflow_dispatch:
    inputs:
      browser:
        description: "🌐 Browser"
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      folder:
        description: "📁 Test Folder"
        required: true
        default: tests
        type: choice
        options:
          - tests

      tag:
        description: "🏷️ Test Tag Filter"
        required: false
        default: "@e2e"
        type: choice
        options:
          - "@all"
          - "@smoke"
          - "@regression"
          - "@e2e"
          - "@authentication"
          - "@inventory"
          - "@filter"
          - "@positive"
          - "@negative"

      environment:
        description: "🌍 Environment"
        required: true
        default: qa
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

      execution_mode:
        description: "🖥️ Execution Mode"
        required: true
        default: headless
        type: choice
        options:
          - headless
          - headed

      retries:
        description: "🔄 Retry Count"
        required: true
        default: "1"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"

      workers:
        description: "⚡ Parallel Workers"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "8"

      publish_report:
        description: "📢 Publish Report"
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📋 Execution Configuration
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "🌐 Browser            : ${{ inputs.browser }}"
          echo "📁 Folder             : ${{ inputs.folder }}"
          echo "🏷️ Tag                : ${{ inputs.tag }}"
          echo "🌍 Environment        : ${{ inputs.environment }}"
          echo "🖥️ Execution Mode     : ${{ inputs.execution_mode }}"
          echo "🔄 Retries            : ${{ inputs.retries }}"
          echo "⚡ Workers            : ${{ inputs.workers }}"
          echo "📢 Publish Report     : ${{ inputs.publish_report }}"

      - name: 🎛️ Generate Variables
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "EXECUTED_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
            echo "BROWSER=${{ github.event.inputs.browser || 'all' }}" >> $GITHUB_ENV
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "EXECUTED_TAG=PR Validation (All Tests)" >> $GITHUB_ENV
            echo "BROWSER=chromium" >> $GITHUB_ENV
            echo "ENVIRONMENT=N/A" >> $GITHUB_ENV
          else
            echo "EXECUTED_TAG=Push Validation (All Tests)" >> $GITHUB_ENV
            echo "BROWSER=chromium" >> $GITHUB_ENV
            echo "ENVIRONMENT=N/A" >> $GITHUB_ENV
          fi

      - name: 🧾 Capture Pull Request Details
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ', ') }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "PR_NUMBER=$PR_NUMBER"
            echo "PR_TITLE<<PR_TITLE_EOF"
            printf '%s\n' "$PR_TITLE"
            echo "PR_TITLE_EOF"
            echo "PR_URL=$PR_URL"
            echo "PR_AUTHOR=$PR_AUTHOR"
            echo "PR_BRANCH=$PR_BRANCH"
            echo "PR_BASE_BRANCH=$PR_BASE_BRANCH"
            echo "PR_LABELS=$PR_LABELS"
            echo "PR_SHA=$PR_SHA"
          } >> "$GITHUB_ENV"

      - name: 💻 Get Runner OS
        run: |
          echo "RUNNER_OS_NAME=$RUNNER_OS" >> $GITHUB_ENV

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Get Node Version
        run: |
          echo "NODE_VERSION=$(node -v)" >> $GITHUB_ENV

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Get Playwright Version
        run: |
          PLAYWRIGHT_VERSION=$(npx playwright --version | awk '{print $2}')
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: ⏱️ Capture Start Details
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "START_DATE=$(date)" >> $GITHUB_ENV

      - name: 🧪 Execute Playwright Tests
        run: |
          CMD="npx playwright test"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            CMD="$CMD ${{ inputs.folder }}"

            if [ "${{ inputs.tag }}" != "@all" ]; then
              CMD="$CMD --grep '${{ inputs.tag }}'"
            fi

            CMD="$CMD --project=${{ inputs.browser }}"
            CMD="$CMD --workers=${{ inputs.workers }}"
            CMD="$CMD --retries=${{ inputs.retries }}"

            if [ "${{ inputs.execution_mode }}" = "headed" ]; then
              CMD="$CMD --headed"
            fi

          elif [ "${{ github.event_name }}" = "pull_request" ]; then

            CMD="$CMD --project=chromium"

          fi

          echo "Executing command:"
          echo "$CMD"
          eval "$CMD"
        continue-on-error: true

      - name: ⏱️ Capture End Details
        if: always()
        run: |
          END_TIME=$(date +%s)

          echo "END_DATE=$(date)" >> $GITHUB_ENV

          DURATION=$((END_TIME - START_TIME))

          echo "EXECUTION_DURATION=${DURATION}s" >> $GITHUB_ENV

      - name: 📊 Extract Test Statistics
        if: always()
        run: |
          PASSED=$(jq '
          [
            .suites[].suites[].specs[]
            | select(.ok == true)
            | select(
                any(.tests[]?; .status == "flaky") | not
              )
          ]
          | length
          ' playwright-report/results.json)

          FAILED=$(jq '
          [
            .suites[].suites[].specs[]
            | select(.ok == false)
          ]
          | length
          ' playwright-report/results.json)

          FLAKY=$(jq '
          [
            .suites[].suites[].specs[]
            | select(
                any(.tests[]?; .status == "flaky")
              )
          ]
          | length
          ' playwright-report/results.json)

          SKIPPED=$(jq '
          [
            .suites[].suites[].specs[]
            | select(
                all(.tests[].results[]?; .status=="skipped")
              )
          ]
          | length
          ' playwright-report/results.json)

          TOTAL=$(jq '
          [
            .suites[].suites[].specs[]
          ]
          | length
          ' playwright-report/results.json)

          SUM=$((PASSED + FAILED + FLAKY + SKIPPED))

          echo "Passed : $PASSED"
          echo "Failed : $FAILED"
          echo "Flaky  : $FLAKY"
          echo "Skipped: $SKIPPED"
          echo "Total  : $TOTAL"
          echo "Sum    : $SUM"

          if [ "$TOTAL" -gt 0 ]; then
            PASS_RATE=$(awk "BEGIN { printf \"%.2f\", (($PASSED + $FLAKY)/$TOTAL)*100 }")
            FAILURE_RATE=$(awk "BEGIN { printf \"%.2f\", ($FAILED/$TOTAL)*100 }")
            FLAKY_RATE=$(awk "BEGIN { printf \"%.2f\", ($FLAKY/$TOTAL)*100 }")
            SKIPPED_RATE=$(awk "BEGIN { printf \"%.2f\", ($SKIPPED/$TOTAL)*100 }")
          else
            PASS_RATE=0
            FAILURE_RATE=0
            FLAKY_RATE=0
            SKIPPED_RATE=0
          fi

          echo "TOTAL_TESTS=$TOTAL" >> $GITHUB_ENV
          echo "PASSED_TESTS=$PASSED" >> $GITHUB_ENV
          echo "FAILED_TESTS=$FAILED" >> $GITHUB_ENV
          echo "FLAKY_TESTS=$FLAKY" >> $GITHUB_ENV
          echo "SKIPPED_TESTS=$SKIPPED" >> $GITHUB_ENV
          echo "PASS_RATE=$PASS_RATE" >> $GITHUB_ENV
          echo "FAILURE_RATE=$FAILURE_RATE" >> $GITHUB_ENV
          echo "FLAKY_RATE=$FLAKY_RATE" >> $GITHUB_ENV
          echo "SKIPPED_RATE=$SKIPPED_RATE" >> $GITHUB_ENV
          if [ "$TOTAL" -gt 0 ]; then
            QUALITY_SCORE=$(awk "BEGIN { printf \"%.0f\", (($PASSED + ($FLAKY*0.5))/$TOTAL)*100 }")
          else
            QUALITY_SCORE=0
          fi

          echo "QUALITY_SCORE=$QUALITY_SCORE" >> $GITHUB_ENV

      - name: 📊 Generate Analytics
        if: always()
        run: node .github/scripts/analytics/generate-analytics.js

      - name: 🔍 Debug Analytics
        if: always()
        run: |
          cat analytics.json

      - name: 🚩 Generate Risk Analysis
        if: always()
        run: node .github/scripts/analytics/generate-risk-report.js

      - name: 📋 Generate Breakdown Reports
        id: breakdown
        if: always()
        run: node .github/scripts/analytics/generate-breakdown.js

      - name: 📈 Generate Historical Trend
        if: always()
        run: node .github/scripts/analytics/generate-historical-trend.js

      - name: 📄 Upload Playwright Report
        id: upload_playwright_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-playwright-report-{0}', github.run_number) || format('playwright-report-{0}', github.run_number) }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📸 Upload Test Results & Failure Attachments
        id: upload_test_results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-failure-screenshots-{0}', github.run_number) || format('failure-screenshots-{0}', github.run_number) }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📄 Upload JSON Results
        id: upload_json_results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-playwright-json-{0}', github.run_number) || format('playwright-json-{0}', github.run_number) }}
          path: playwright-report/results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 📊 Upload Allure Results
        id: upload_allure_results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-allure-results-{0}', github.run_number) || format('allure-results-{0}', github.run_number) }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: 🛠️ Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: 📊 Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ -n "$(find allure-results -type f -print -quit)" ]; then
            allure generate allure-results --clean -o allure-report
          else
            echo "No Allure results found. Skipping report generation."
          fi

      - name: 📊 Upload Allure Report
        id: upload_allure_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-allure-report-{0}', github.run_number) || format('allure-report-{0}', github.run_number) }}
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📦 Upload Analytics Dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-dataset-${{ github.run_number }}
          path: analytics.json
          retention-days: 7

      - name: 📤 Upload Markdown Reports
        id: upload_markdown_reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-markdown-execution-reports-{0}', github.run_number) || format('markdown-execution-reports-{0}', github.run_number) }}
          path: |
            release-readiness.md
            release-readiness.json
            application-health-dashboard.md
            module-breakdown.md
            tag-execution-summary.md
            top-risk-modules.md
            failed-modules.md
            failed-tests.md
            flaky-tests.md
            slowest-module.md
            report-links.md
            historical-test-trend.md
          if-no-files-found: warn
          retention-days: 7

      - name: 🔗 Prepare Report Links
        id: report_links
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAYWRIGHT_REPORT_URL: ${{ steps.upload_playwright_report.outputs.artifact-url }}
          TEST_RESULTS_URL: ${{ steps.upload_test_results.outputs.artifact-url }}
          JSON_RESULTS_URL: ${{ steps.upload_json_results.outputs.artifact-url }}
          ALLURE_RESULTS_URL: ${{ steps.upload_allure_results.outputs.artifact-url }}
          ALLURE_REPORT_URL: ${{ steps.upload_allure_report.outputs.artifact-url }}
          MARKDOWN_REPORT_URL: ${{ steps.upload_markdown_reports.outputs.artifact-url }}
        run: |
          # ------- Generate Markdown Report Links -------
          {
            echo ""
            echo "| **Report** | **Link** |"
            echo "| ----------------------------- | -------- |"
            echo "| 🎭 Playwright Report | ${PLAYWRIGHT_REPORT_URL:+[Download]($PLAYWRIGHT_REPORT_URL)} |"
            echo "| 🧪 Test Results & Attachments | ${TEST_RESULTS_URL:+[Download]($TEST_RESULTS_URL)} |"
            echo "| 📄 JSON Results | ${JSON_RESULTS_URL:+[Download]($JSON_RESULTS_URL)} |"
            echo "| 📊 Allure Results | ${ALLURE_RESULTS_URL:+[Download]($ALLURE_RESULTS_URL)} |"
            echo "| 📊 Allure Report | ${ALLURE_REPORT_URL:+[Download]($ALLURE_REPORT_URL)} |"
            echo "| 📁 Markdown Execution Reports | ${MARKDOWN_REPORT_URL:+[Download]($MARKDOWN_REPORT_URL)} |"
            echo ""
            echo "[🔍 View GitHub Actions Run]($RUN_URL)"
          } > report-links.md

          # ------- Generate Slack Report Links -------
          SLACK_LINKS="<${RUN_URL}|GitHub Actions Run>"
          if [ -n "$PLAYWRIGHT_REPORT_URL" ]; then
            SLACK_LINKS="$SLACK_LINKS | <${PLAYWRIGHT_REPORT_URL}|Playwright Report>"
          fi
          if [ -n "$TEST_RESULTS_URL" ]; then
            SLACK_LINKS="$SLACK_LINKS | <${TEST_RESULTS_URL}|Test Results>"
          fi
          if [ -n "$JSON_RESULTS_URL" ]; then
            SLACK_LINKS="$SLACK_LINKS | <${JSON_RESULTS_URL}|JSON Results>"
          fi
          if [ -n "$ALLURE_RESULTS_URL" ]; then
            SLACK_LINKS="$SLACK_LINKS | <${ALLURE_RESULTS_URL}|Allure Results>"
          fi
          if [ -n "$ALLURE_REPORT_URL" ]; then
            SLACK_LINKS="$SLACK_LINKS | <${ALLURE_REPORT_URL}|Allure Report>"
          fi
          if [ -n "$MARKDOWN_REPORT_URL" ]; then
            SLACK_LINKS="$SLACK_LINKS | <${MARKDOWN_REPORT_URL}|Markdown Execution Reports>"
          fi
          echo "REPORT_LINKS_SLACK=$SLACK_LINKS" >> "$GITHUB_OUTPUT"

      - name: 🎨 Prepare Build Status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success)
              echo "BUILD_STATUS=PASSED" >> "$GITHUB_ENV"
              echo "BUILD_EMOJI=🟢" >> "$GITHUB_ENV"
              echo "BUILD_TEXT=✅ Validation Status: PASSED" >> "$GITHUB_ENV"
              echo "BUILD_COLOR=good" >> "$GITHUB_ENV"
              ;;

            failure)
              echo "BUILD_STATUS=FAILED" >> "$GITHUB_ENV"
              echo "BUILD_EMOJI=🔴" >> "$GITHUB_ENV"
              echo "BUILD_TEXT=❌ Validation Status: FAILED" >> "$GITHUB_ENV"
              echo "BUILD_COLOR=danger" >> "$GITHUB_ENV"
              ;;

            cancelled)
              echo "BUILD_STATUS=CANCELLED" >> "$GITHUB_ENV"
              echo "BUILD_EMOJI=⚪" >> "$GITHUB_ENV"
              echo "BUILD_TEXT=⚪ Validation Status: CANCELLED" >> "$GITHUB_ENV"
              echo "BUILD_COLOR=warning" >> "$GITHUB_ENV"
              ;;

            *)
              echo "BUILD_STATUS=UNKNOWN" >> "$GITHUB_ENV"
              echo "BUILD_EMOJI=⚪" >> "$GITHUB_ENV"
              echo "BUILD_TEXT=⚪ Validation Status: UNKNOWN" >> "$GITHUB_ENV"
              echo "BUILD_COLOR=warning" >> "$GITHUB_ENV"
              ;;
          esac

      - name: 🚦 Prepare Execution Health
        if: always()
        run: |
          TOTAL="${TOTAL_TESTS:-0}"
          FAILED="${FAILED_TESTS:-0}"
          FLAKY="${FLAKY_TESTS:-0}"

          if [ "$TOTAL" -eq 0 ]; then
            HEALTH="⚪ Unknown - No Test Results"

          elif [ "$FAILED" -eq 0 ] && [ "$FLAKY" -eq 0 ]; then
            HEALTH="🟢 Excellent - All Tests Passed"

          elif [ "$FAILED" -eq 0 ] && [ "$FLAKY" -gt 0 ]; then
            HEALTH="🟡 Stable with Flaky Tests"

          else
            HEALTH="🔴 Failures Detected - Investigation Required"
          fi

          echo "EXECUTION_HEALTH=$HEALTH" >> "$GITHUB_ENV"

      - name: 📨 Generate Notification Data
        id: notification_data
        if: always()
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

          SLACK_CHANNEL: C0CDR49PPSL

          BUILD_EMOJI: ${{ env.BUILD_EMOJI }}
          BUILD_TEXT: ${{ env.BUILD_TEXT }}
          EXECUTION_HEALTH: ${{ env.EXECUTION_HEALTH }}

          BROWSER: ${{ env.BROWSER }}
          EXECUTED_TAG: ${{ env.EXECUTED_TAG }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}

          PLAYWRIGHT_VERSION: ${{ env.PLAYWRIGHT_VERSION }}
          NODE_VERSION: ${{ env.NODE_VERSION }}
          RUNNER_OS_NAME: ${{ env.RUNNER_OS_NAME }}

          START_DATE: ${{ env.START_DATE }}
          END_DATE: ${{ env.END_DATE }}
          EXECUTION_DURATION: ${{ env.EXECUTION_DURATION }}

          TOTAL_TESTS: ${{ env.TOTAL_TESTS }}
          PASSED_TESTS: ${{ env.PASSED_TESTS }}
          FAILED_TESTS: ${{ env.FAILED_TESTS }}
          FLAKY_TESTS: ${{ env.FLAKY_TESTS }}
          SKIPPED_TESTS: ${{ env.SKIPPED_TESTS }}

          PASS_RATE: ${{ env.PASS_RATE }}
          FAILURE_RATE: ${{ env.FAILURE_RATE }}
          FLAKY_RATE: ${{ env.FLAKY_RATE }}
          SKIPPED_RATE: ${{ env.SKIPPED_RATE }}
          QUALITY_SCORE: ${{ env.QUALITY_SCORE }}

          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          PLAYWRIGHT_REPORT_URL: ${{ steps.upload_playwright_report.outputs.artifact-url }}
          TEST_RESULTS_URL: ${{ steps.upload_test_results.outputs.artifact-url }}
          JSON_RESULTS_URL: ${{ steps.upload_json_results.outputs.artifact-url }}
          ALLURE_RESULTS_URL: ${{ steps.upload_allure_results.outputs.artifact-url }}
          ALLURE_REPORT_URL: ${{ steps.upload_allure_report.outputs.artifact-url }}
          MARKDOWN_REPORT_URL: ${{ steps.upload_markdown_reports.outputs.artifact-url }}

          PR_NUMBER: ${{ env.PR_NUMBER }}
          PR_TITLE: ${{ env.PR_TITLE }}
          PR_URL: ${{ env.PR_URL }}
          PR_AUTHOR: ${{ env.PR_AUTHOR }}
          PR_BRANCH: ${{ env.PR_BRANCH }}
          PR_BASE_BRANCH: ${{ env.PR_BASE_BRANCH }}
          PR_LABELS: ${{ env.PR_LABELS }}
          PR_SHA: ${{ env.PR_SHA }}

        run: |
          node .github/scripts/reporting/generate-notification-data.js

      - name: 📋 Generate Execution Summary
        if: always()
        run: |
          append_report() {
            if [ -s "$1" ]; then
              cat "$1" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "_Report unavailable: $1_" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          echo "# 🎭 Playwright Execution Summary" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "## ${{ env.BUILD_EMOJI }} Pull Request Validation" >> "$GITHUB_STEP_SUMMARY"

          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "## ${{ env.BUILD_EMOJI }} Manual Validation" >> "$GITHUB_STEP_SUMMARY"

          else
            echo "## ${{ env.BUILD_EMOJI }} Push Validation" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "${{ env.BUILD_TEXT }}" >> $GITHUB_STEP_SUMMARY

          echo "## ❤️ Execution Health" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.EXECUTION_HEALTH }}" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Executed ${{ env.TOTAL_TESTS }} automated tests with a pass rate of ${{ env.PASS_RATE }}% in ${{ env.EXECUTION_DURATION }}." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📋 Execution Overview" >> $GITHUB_STEP_SUMMARY

          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Browser | ${{ env.BROWSER }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "| 📁 Test Folder | ${{ github.event.inputs.folder }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🏷️ Test Tag Filter | ${{ env.EXECUTED_TAG }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🏷️ Executed Tag | ${{ env.EXECUTED_TAG }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| 🌍 Environment | ${{ env.ENVIRONMENT }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "| 🖥️ Execution Mode | ${{ github.event.inputs.execution_mode }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔄 Retry Count | ${{ github.event.inputs.retries }} |" >> $GITHUB_STEP_SUMMARY
            echo "| ⚡ Parallel Workers | ${{ github.event.inputs.workers }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 📢 Publish Report | ${{ github.event.inputs.publish_report }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| 🎭 Playwright Version | ${{ env.PLAYWRIGHT_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Node Version | ${{ env.NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 💻 Runner OS | ${{ env.RUNNER_OS_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ▶️ Start Time | ${{ env.START_DATE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏹️ End Time | ${{ env.END_DATE }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📋 Pull Request Details" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔢 PR Number | #$PR_NUMBER |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 📝 PR Title | $PR_TITLE |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🔗 PR URL | $PR_URL |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 👤 Author | $PR_AUTHOR |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🌿 Source Branch | $PR_BRANCH |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🎯 Target Branch | $PR_BASE_BRANCH |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🏷️ Labels | $PR_LABELS |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🔖 Commit SHA | $PR_SHA |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "## 🛡️ Release Readiness" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          append_report release-readiness.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📊 Execution Metrics" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value | % |" >> $GITHUB_STEP_SUMMARY
          echo "|:----------:|:----------:|:----------:|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Total Tests | ${{ env.TOTAL_TESTS }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | ${{ env.PASSED_TESTS }} | ${{ env.PASS_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | ${{ env.FAILED_TESTS }} | ${{ env.FAILURE_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚠️ Flaky | ${{ env.FLAKY_TESTS }} | ${{ env.FLAKY_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭️ Skipped | ${{ env.SKIPPED_TESTS }} | ${{ env.SKIPPED_RATE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏆 Quality Score | - | ${{ env.QUALITY_SCORE }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏱️ Duration | ${{ env.EXECUTION_DURATION }} | - |" >> $GITHUB_STEP_SUMMARY

          echo "## 🖥️ Application Health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          append_report application-health-dashboard.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📦 Module Breakdown" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          append_report module-breakdown.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🏷️ Test Tag Analytics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          append_report tag-execution-summary.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🏆 Top Risk Module" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          append_report top-risk-modules.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## ❌ Failed Modules" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          append_report failed-modules.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## ❌ Failed Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          append_report failed-tests.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## ⚠️ Flaky Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          append_report flaky-tests.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## ⏱️ Slowest Module" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          append_report slowest-module.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📈 Historical Test Trend" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          append_report historical-test-trend.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🔗 Report Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          append_report report-links.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.upload_markdown_reports.outputs.artifact-url }}" ]; then
            echo "[📄 Download Markdown Execution Reports](${{ steps.upload_markdown_reports.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 🔍 Debug Notification Data
        run: |
          cat notification-data.json

      - name: 📨 Generate Slack Payload
        if: always()
        run: |
          node .github/scripts/notifications/generate-slack-pr.js

      - name: 🔍 Debug Notification Data
        if: always()
        run: |
          echo "Checking notification-data.json"

          if [ -f notification-data.json ]; then
            node -e "
              const data = require('./notification-data.json');

              console.log('Execution Context:', data.context);
              console.log('Execution Metrics:', data.metrics);
              console.log('PR Details:', data.pr);
              console.log('Risk Analysis:', data.risk.summary);
              console.log('Report Links:', data.links);
            "
          else
            echo "❌ notification-data.json was not generated."
            exit 1
          fi

      - name: 🔍 Debug Slack Payload
        run: |
          cat pr-slack.json

      - name: 📣 Publish Slack Notification
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_GITHUB_ACTIONS_PR_MANUAL_SLACK_BOT_TOKEN }}
          payload-file-path: ./pr-slack.json

      - name: 📝 Generate PR Comment
        if: always() && github.event_name == 'pull_request'
        run: node .github/scripts/notifications/generate-pr-comment.js

      - name: 📬 Publish or Update PR Comment
        if: always() && github.event_name == 'pull_request' && hashFiles('pr-comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- playwright-validation-report -->';
            const body = fs.readFileSync('pr-comment.md', 'utf8');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number
            });

            const existing = comments.find(comment =>
              comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });

              core.info('Existing Playwright PR comment updated.');
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });

              core.info('New Playwright PR comment created.');
            }