name: 🎭 Playwright Validation

run-name: >
  ${{
    github.event_name == 'workflow_dispatch'
    && format('🎭 Manual Validation | {0} | {1}', github.event.inputs.environment, github.event.inputs.browser)
    || github.event_name == 'pull_request'
    && format('✅ PR #{0} | {1}', github.event.pull_request.number, github.head_ref)
    || format('✅ Push Validation #{0}', github.run_number)
  }}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  TEST_ENV: ${{ github.event.inputs.environment || 'qa' }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # Manual Trigger
  workflow_dispatch:
    inputs:
      browser:
        description: "🌐 Browser"
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      folder:
        description: "📁 Test Folder"
        required: true
        default: tests
        type: choice
        options:
          - tests

      tag:
        description: "🏷️ Test Tag Filter"
        required: false
        default: "@e2e"
        type: choice
        options:
          - "@all"
          - "@smoke"
          - "@regression"
          - "@e2e"
          - "@authentication"
          - "@inventory"
          - "@filter"
          - "@positive"
          - "@negative"

      environment:
        description: "🌍 Environment"
        required: true
        default: qa
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

      execution_mode:
        description: "🖥️ Execution Mode"
        required: true
        default: headless
        type: choice
        options:
          - headless
          - headed

      retries:
        description: "🔄 Retry Count"
        required: true
        default: "1"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"

      workers:
        description: "⚡ Parallel Workers"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "8"

      publish_report:
        description: "📢 Publish Report"
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📋 Execution Configuration
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "🌐 Browser            : ${{ inputs.browser }}"
          echo "📁 Folder             : ${{ inputs.folder }}"
          echo "🏷️ Tag                : ${{ inputs.tag }}"
          echo "🌍 Environment        : ${{ inputs.environment }}"
          echo "🖥️ Execution Mode     : ${{ inputs.execution_mode }}"
          echo "🔄 Retries            : ${{ inputs.retries }}"
          echo "⚡ Workers            : ${{ inputs.workers }}"
          echo "📢 Publish Report     : ${{ inputs.publish_report }}"

      - name: 🎛️ Generate Variables
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "EXECUTED_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
            echo "BROWSER=${{ github.event.inputs.browser || 'all' }}" >> $GITHUB_ENV
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "EXECUTED_TAG=PR Validation (All Tests)" >> $GITHUB_ENV
            echo "BROWSER=chromium" >> $GITHUB_ENV
            echo "ENVIRONMENT=N/A" >> $GITHUB_ENV
          else
            echo "EXECUTED_TAG=Push Validation (All Tests)" >> $GITHUB_ENV
            echo "BROWSER=chromium" >> $GITHUB_ENV
            echo "ENVIRONMENT=N/A" >> $GITHUB_ENV
          fi

      - name: 💻 Get Runner OS
        run: |
          echo "RUNNER_OS_NAME=$RUNNER_OS" >> $GITHUB_ENV

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Get Node Version
        run: |
          echo "NODE_VERSION=$(node -v)" >> $GITHUB_ENV

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Get Playwright Version
        run: |
          PLAYWRIGHT_VERSION=$(npx playwright --version | awk '{print $2}')
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: ⏱️ Capture Start Details
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "START_DATE=$(date)" >> $GITHUB_ENV

      - name: 🧪 Execute Playwright Tests
        run: |
          CMD="npx playwright test"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            CMD="$CMD ${{ inputs.folder }}"

            if [ "${{ inputs.tag }}" != "@all" ]; then
              CMD="$CMD --grep '${{ inputs.tag }}'"
            fi

            CMD="$CMD --project=${{ inputs.browser }}"
            CMD="$CMD --workers=${{ inputs.workers }}"
            CMD="$CMD --retries=${{ inputs.retries }}"

            if [ "${{ inputs.execution_mode }}" = "headed" ]; then
              CMD="$CMD --headed"
            fi

          elif [ "${{ github.event_name }}" = "pull_request" ]; then

            CMD="$CMD --project=chromium"

          fi

          echo "Executing command:"
          echo "$CMD"
          eval "$CMD"
        continue-on-error: true

      - name: ⏱️ Capture End Details
        if: always()
        run: |
          END_TIME=$(date +%s)

          echo "END_DATE=$(date)" >> $GITHUB_ENV

          DURATION=$((END_TIME - START_TIME))

          echo "EXECUTION_DURATION=${DURATION}s" >> $GITHUB_ENV

      - name: 📊 Extract Test Statistics
        if: always()
        run: |
          PASSED=$(jq '
          [
            .suites[].suites[].specs[]
            | select(.ok == true)
            | select(
                any(.tests[].results[]?; .status=="flaky") | not
              )
          ]
          | length
          ' playwright-report/results.json)

          FAILED=$(jq '
          [
            .suites[].suites[].specs[]
            | select(.ok == false)
          ]
          | length
          ' playwright-report/results.json)

          FLAKY=$(jq '
          [
            .suites[].suites[].specs[]
            | select(
                any(.tests[].results[]?; .status=="flaky")
              )
          ]
          | length
          ' playwright-report/results.json)

          SKIPPED=$(jq '
          [
            .suites[].suites[].specs[]
            | select(
                all(.tests[].results[]?; .status=="skipped")
              )
          ]
          | length
          ' playwright-report/results.json)

          TOTAL=$(jq '
          [
            .suites[].suites[].specs[]
          ]
          | length
          ' playwright-report/results.json)

          SUM=$((PASSED + FAILED + FLAKY + SKIPPED))

          echo "Passed : $PASSED"
          echo "Failed : $FAILED"
          echo "Flaky  : $FLAKY"
          echo "Skipped: $SKIPPED"
          echo "Total  : $TOTAL"
          echo "Sum    : $SUM"

          if [ "$TOTAL" -gt 0 ]; then
            PASS_RATE=$(awk "BEGIN { printf \"%.2f\", (($PASSED + $FLAKY)/$TOTAL)*100 }")
            FAILURE_RATE=$(awk "BEGIN { printf \"%.2f\", ($FAILED/$TOTAL)*100 }")
            FLAKY_RATE=$(awk "BEGIN { printf \"%.2f\", ($FLAKY/$TOTAL)*100 }")
            SKIPPED_RATE=$(awk "BEGIN { printf \"%.2f\", ($SKIPPED/$TOTAL)*100 }")
          else
            PASS_RATE=0
            FAILURE_RATE=0
            FLAKY_RATE=0
            SKIPPED_RATE=0
          fi

          echo "PASSED_TESTS=$PASSED" >> $GITHUB_ENV
          echo "FAILED_TESTS=$FAILED" >> $GITHUB_ENV
          echo "SKIPPED_TESTS=$SKIPPED" >> $GITHUB_ENV
          echo "FLAKY_TESTS=$FLAKY" >> $GITHUB_ENV
          echo "TOTAL_TESTS=$TOTAL" >> $GITHUB_ENV

          echo "PASS_RATE=$PASS_RATE" >> $GITHUB_ENV
          echo "FAILURE_RATE=$FAILURE_RATE" >> $GITHUB_ENV
          echo "FLAKY_RATE=$FLAKY_RATE" >> $GITHUB_ENV
          echo "SKIPPED_RATE=$SKIPPED_RATE" >> $GITHUB_ENV
          if [ "$TOTAL" -gt 0 ]; then
            QUALITY_SCORE=$(awk "BEGIN { printf \"%.0f\", (($PASSED + ($FLAKY*0.5))/$TOTAL)*100 }")
          else
            QUALITY_SCORE=0
          fi

          echo "QUALITY_SCORE=$QUALITY_SCORE" >> $GITHUB_ENV

      # - name: 🔍 Debug Specs
      #   if: always()
      #   run: |
      #     jq '
      #       .suites[].suites[]
      #       | {
      #           file,
      #           specs
      #         }
      #     ' playwright-report/results.json

      # - name: 🔍 Debug Playwright Structure
        # if: always()
        # run: |
        #   jq '
        #     ..
        #     | objects
        #     | select(has("file"))
        #     | {file,title,status}
        #   ' playwright-report/results.json | head -100

      # - name: 🔍 Debug Spec Summary
      #   if: always()
      #   run: |
      #     jq '
      #     .suites[].suites[].specs[]
      #     | {
      #         title,
      #         ok
      #       }
      #     ' playwright-report/results.json

      - name: 📋 Collect PR Details
        if: github.event_name == 'pull_request'
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "PR_TITLE=${{ github.event.pull_request.title }}" >> $GITHUB_ENV
          echo "PR_AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_ENV
          echo "PR_URL=${{ github.event.pull_request.html_url }}" >> $GITHUB_ENV
          echo "PR_BRANCH=${{ github.event.pull_request.head.ref }}" >> $GITHUB_ENV
          echo "PR_BASE_BRANCH=${{ github.event.pull_request.base.ref }}" >> $GITHUB_ENV
          echo "PR_LABELS=${{ join(github.event.pull_request.labels.*.name, ', ') }}" >> $GITHUB_ENV
          echo "PR_SHA=${{ join(github.event.pull_request.merge_commit_sha, ', ') }}" >> $GITHUB_ENV

      # - name: 🔍 Debug Playwright Report
      #   if: always()
      #   run: |
      #     echo "Checking report..."

      #     ls -R playwright-report || true

      #     if [ -f playwright-report/results.json ]; then
      #       echo "results.json exists"

      #       echo "===== FIRST 100 LINES ====="
      #       head -100 playwright-report/results.json

      #       echo "===== TEST STATUS ENTRIES ====="
      #       jq '.. | .status? // empty' playwright-report/results.json
            
      #     else
      #       echo "results.json NOT FOUND"
      #     fi

      # - name: 🔍 Find Outcome Structure
      #   if: always()
      #   run: |
      #     echo "===== SEARCH outcome ====="
      #     grep -n "outcome" playwright-report/results.json | head -20

      #     echo "===== SEARCH status ====="
      #     grep -n "status" playwright-report/results.json | head -20

      #     echo "===== SEARCH title ====="
      #     grep -n "title" playwright-report/results.json | head -20

      # - name: 🔍 Inspect Test Node
      #   if: always()
      #   run: |
      #     jq '
      #       ..
      #       | objects
      #       | select(has("title"))
      #       | {title,status,outcome}
      #     ' playwright-report/results.json | head -200

      # - name: 🔍 Debug Application Paths
      #   if: always()
      #   run: |
      #     jq -r '
      #     .suites[].suites[]
      #     | select(.file != null)
      #     | .file
      #     ' playwright-report/results.json

      - name: 📦 Build Breakdown Data
        id: breakdown
        if: always()
        run: |
          # Get Application
          get_app_name() {
            case "$1" in
              sauce-demo)   echo "SauceDemo" ;;
              orangehr)     echo "OrangeHR" ;;
              qa-playground) echo "QA Playground" ;;
              *)            echo "$1" ;;
            esac
          }

          # Get Health
            get_health() {
              local FAILED=$1
              local FLAKY=$2
              if [ "$FAILED" -gt 0 ]; then
                echo "🔴 Critical"
              elif [ "$FLAKY" -gt 0 ]; then
                echo "🟡 Unstable"
              else
                echo "🟢 Healthy"
              fi
            }

          # Common Calculation
          calculate_metrics() {
            local TOTAL=$1
            local PASSED=$2
            local FAILED=$3
            local FLAKY=$4
            local SKIPPED=$5

            if [ "$TOTAL" -gt 0 ]; then
              HEALTH=$(get_health "$FAILED" "$FLAKY")
              PASS_RATE=$(awk "BEGIN { printf \"%.2f\", (($PASSED + $FLAKY)/$TOTAL)*100 }")
              FAIL_RATE=$(awk "BEGIN { printf \"%.2f\", ($FAILED/$TOTAL)*100 }")
              FLAKY_RATE=$(awk "BEGIN { printf \"%.2f\", ($FLAKY/$TOTAL)*100 }")
              SKIP_RATE=$(awk "BEGIN { printf \"%.2f\", ($SKIPPED/$TOTAL)*100 }")
              QUALITY_SCORE=$(awk "BEGIN {
                printf \"%.0f\",
                (($PASSED + ($FLAKY * 0.5))/$TOTAL)*100
              }")
            else
              HEALTH=$(get_health "$FAILED" "$FLAKY")
              PASS_RATE=0
              FAIL_RATE=0
              FLAKY_RATE=0
              SKIP_RATE=0
              QUALITY_SCORE=0
            fi
          }

          # Table header for Application Health Dashboard
          echo "| Application | Total | Passed | Failed | Flaky | Skipped | Pass Rate | Fail Rate | Flaky Rate | Skipped Rate | Quality Score | Health |" > application-health-dashboard.md
          echo "|-------------|--------|--------|--------|--------|--------|-----------|-----------|------------|-----------|-----------|-----------|" >> application-health-dashboard.md

          # Table header for Module Breakdown
          echo "| Application | Module | Total | Passed | Failed | Flaky | Skipped | Pass Rate | Fail Rate | Flaky Rate | Skipped Rate | Quality Score | Health |" > module-breakdown.md
          echo "|-------------|-------------|--------|--------|--------|--------|---------|-----------|-----------|------------|--------------|---------------|-----------|" >> module-breakdown.md

          # Application Health Dashboard
          jq -r '
          .suites[].suites[]
          | select(.file != null)
          | [
              (.file | split("/")[0]),

              (.specs | length),

              ([.specs[]
                | select(.ok == true)
                | select(
                    any(.tests[].results[]?; .status=="flaky") | not
                  )
              ] | length),

              ([.specs[]
                | select(.ok == false)
              ] | length),

              ([.specs[]
                | select(
                    any(.tests[].results[]?; .status=="flaky")
                  )
              ] | length),

              ([.specs[]
                | select(
                    all(.tests[].results[]?; .status=="skipped")
                  )
              ] | length)
          ]
          | @tsv
          ' playwright-report/results.json |
          awk -F'\t' '
          {
              total[$1] += $2
              passed[$1] += $3
              failed[$1] += $4
              flaky[$1] += $5
              skipped[$1] += $6
          }
          END {
              for (app in total)
                  print app "\t" total[app] "\t" passed[app] "\t" failed[app] "\t" flaky[app] "\t" skipped[app]
          }' |
          while IFS=$'\t' read -r APP TOTAL PASSED FAILED FLAKY SKIPPED
          do
            APP_NAME=$(get_app_name "$APP")
            if [ "$TOTAL" -gt 0 ]; then
              calculate_metrics \
                "$TOTAL" \
                "$PASSED" \
                "$FAILED" \
                "$FLAKY" \
                "$SKIPPED"
            else
              PASS_RATE=0
              FAIL_RATE=0
              FLAKY_RATE=0
              SKIP_RATE=0
              QUALITY_SCORE=0
            fi
            echo "| $APP_NAME | $TOTAL | $PASSED | $FAILED | $FLAKY | $SKIPPED | ${PASS_RATE}% | ${FAIL_RATE}% | ${FLAKY_RATE}% | ${SKIP_RATE}% | ${QUALITY_SCORE}% | $HEALTH |" >> application-health-dashboard.md
          done

          # Module Breakdown
          jq -r '
          .suites[].suites[]
          | select(.file != null)
          | [
              (.file | split("/")[0]),
              (.file | split("/")[1] | sub("\\.spec\\.js$"; "")),

              (.specs | length),

              ([.specs[]
                | select(.ok == true)
                | select(
                    any(.tests[].results[]?; .status=="flaky") | not
                )
              ] | length),

              ([.specs[]
                | select(.ok == false)
              ] | length),

              ([.specs[]
                | select(
                    any(.tests[].results[]?; .status=="flaky")
                )
              ] | length),

              ([.specs[]
                | select(
                    all(.tests[].results[]?; .status=="skipped")
                )
              ] | length)
          ]
          | @tsv
          ' playwright-report/results.json |
          while IFS=$'\t' read -r APP MODULE TOTAL PASSED FAILED FLAKY SKIPPED
          do
            APP_NAME=$(get_app_name "$APP")
            if [ "$TOTAL" -gt 0 ]; then
              calculate_metrics \
                "$TOTAL" \
                "$PASSED" \
                "$FAILED" \
                "$FLAKY" \
                "$SKIPPED"
            else
              PASS_RATE=0
              FAIL_RATE=0
              FLAKY_RATE=0
              SKIP_RATE=0
              QUALITY_SCORE=0
            fi
            echo "| $APP_NAME | $MODULE | $TOTAL | $PASSED | $FAILED | $FLAKY | $SKIPPED | ${PASS_RATE}% | ${FAIL_RATE}% | ${FLAKY_RATE}% | ${SKIP_RATE}% | ${QUALITY_SCORE}% | $HEALTH |" >> module-breakdown.md
          done

          # Generate Slack formatted text
          node <<'NODE'
          const fs = require('fs');
          function readTable(file) {
            return fs.readFileSync(file, 'utf8')
              .split(/\r?\n/)
              .filter(line => line.trim().startsWith('|'))
              .filter(line => !/^\|[\s|:-]+\|$/.test(line.trim()))
              .map(line => line.trim()
                .replace(/^\|/, '')
                .replace(/\|$/, '')
                .split('|')
                .map(cell => cell.trim())
              );
          }

          # Application Health Dashboard
          const appRows = readTable('application-health-dashboard.md');
          const appText = appRows.slice(1).map(row =>
            `• *${row[0]}* — Total: ${row[1]} | Passed: ${row[2]} | Failed: ${row[3]} | Flaky: ${row[4]} | Skipped: ${row[5]} | Health: ${row[11]}`
          ).join('\n');
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `APPLICATION_HEALTH_TEXT=${JSON.stringify(appText)}\n`
          );

          # Module Breakdown grouped by Application
          const moduleRows = readTable('module-breakdown.md').slice(1);
          const grouped = {};
          for (const row of moduleRows) {
            const [
              application, module, total, passed, failed,
              flaky, skipped, passRate, failRate,
              flakyRate, skippedRate, qualityScore, health
            ] = row;
            if (!grouped[application]) {
              grouped[application] = [];
            }
            grouped[application].push(
              `   • *${module}* — Total: ${total} | Passed: ${passed} | Failed: ${failed} | Flaky: ${flaky} | Skipped: ${skipped} | Health: ${health}`
            );
          }
          const moduleText = Object.entries(grouped)
            .map(([application, modules]) =>
              `📦 *${application}*\n${modules.join('\n')}`
            )
            .join('\n\n');
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `MODULE_BREAKDOWN_TEXT=${JSON.stringify(moduleText)}\n`
          );
          NODE

      # - name: 🔍 Debug Breakdown Tables
      #   if: always()
      #   run: |
      #     echo "===== APPLICATION HEALTH ====="
      #     cat application-health-dashboard.md

      #     echo "===== MODULE BREAKDOWN ====="
      #     cat module-breakdown.md

      #     echo "===== SLACK TABLE OUTPUTS ====="
      #     echo '${{ steps.breakdown.outputs.APPLICATION_HEALTH_ROWS }}' | jq .
          # echo '${{ steps.breakdown.outputs.MODULE_BREAKDOWN_ROWS }}' | jq .

      - name: 📄 Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-playwright-report-{0}', github.run_number) || format('playwright-report-{0}', github.run_number) }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📸 Upload Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-failure-screenshots-{0}', github.run_number) || format('failure-screenshots-{0}', github.run_number) }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📦 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-test-results-{0}', github.run_number) || format('test-results-{0}', github.run_number) }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📄 Upload JSON Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-playwright-json-{0}', github.run_number) || format('playwright-json-{0}', github.run_number) }}
          path: playwright-report/results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 📊 Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-allure-results-{0}', github.run_number) || format('allure-results-{0}', github.run_number) }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: 🛠️ Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: 📊 Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            allure generate allure-results --clean -o allure-report
          else
            echo "No allure-results found. Skipping."
          fi

      - name: 📊 Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-allure-report-{0}', github.run_number) || format('allure-report-{0}', github.run_number) }}
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 7

      # - name: Create PR Info
      #   id: pr_info
      #   if: always() && github.event_name == 'pull_request'
      #   run: |
      #     {
      #       echo 'INFO<<EOF'
      #       echo "*🤖 Auto Merge:* Pending"
      #       echo "*🔀 PR:* #${{ github.event.pull_request.number }}"
      #       echo "*📝 Title:* ${{ github.event.pull_request.title }}"
      #       echo "*🔗 Pull Request:* ${{ github.event.pull_request.html_url }}"
      #       echo "*👤 Author:* ${{ github.event.pull_request.user.login }}"
      #       echo "*🌿 Source Branch:* ${{ github.event.pull_request.head.ref }}"
      #       echo "*🎯 Target Branch:* ${{ github.head_ref }}"
      #       echo "*🏷️ Labels:* ${{ steps.labels.outputs.LABELS }}"
      #       echo "*🔖 Commit SHA:* ${{ github.sha }}"
      #       echo EOF
      #     } >> $GITHUB_OUTPUT

      - name: 🎨 Prepare Build Status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "BUILD_STATUS=PASSED" >> $GITHUB_ENV
            echo "BUILD_EMOJI=🟢" >> $GITHUB_ENV
            echo "BUILD_TEXT=✅ Build Status: PASSED" >> $GITHUB_ENV
            echo "BUILD_COLOR=good" >> $GITHUB_ENV
          else
            echo "BUILD_STATUS=FAILED" >> $GITHUB_ENV
            echo "BUILD_EMOJI=🔴" >> $GITHUB_ENV
            echo "BUILD_TEXT=❌ Build Status: FAILED" >> $GITHUB_ENV
            echo "BUILD_COLOR=danger" >> $GITHUB_ENV
          fi

      - name: 🚦 Prepare Execution Health
        if: always()
        run: |
