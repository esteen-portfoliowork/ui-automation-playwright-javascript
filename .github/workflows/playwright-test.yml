name: 🎭 Playwright Validation

run-name: >
  ${{
    github.event_name == 'workflow_dispatch'
    && format('🎭 Manual Execution #{0}', github.run_number)
    || format('✅ PR Validation #{0}', github.run_number)
  }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # Manual Trigger
  workflow_dispatch:
    inputs:
      browser:
        description: Browser
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      folder:
        description: Test Folder
        required: true
        default: all
        type: choice
        options:
          - practice
          - demo
          - all

      tag:
        description: Test Tag
        required: false
        default: ""
        type: string

      environment:
        description: Environment
        required: true
        default: uat
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

      execution_mode:
        description: Execution Mode
        required: true
        default: headless
        type: choice
        options:
          - headless
          - headed

      retries:
        description: Retry Count
        required: true
        default: "1"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"

      workers:
        description: Parallel Workers
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "8"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Tests
        run: npx playwright test
        continue-on-error: true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: test-results/
          if-no-files-found: ignore

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_GITHUB_ACTIONS_PR_MANUAL_SLACK_BOT_TOKEN }}
          payload: |
            channel: "C0CDR49PPSL"
            text: |
              🚀 Playwright Execution Finished

              📊 Status: ${{ job.status }}
              🌿 Branch: ${{ github.ref_name }}
              👤 Actor: ${{ github.actor }}

              🔗 Workflow:
              https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

              📄 Playwright Report:
              Download from workflow artifacts

              📊 Allure Report:
              Download from workflow artifacts