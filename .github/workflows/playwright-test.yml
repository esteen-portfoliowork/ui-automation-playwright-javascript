      #         🔗 Workflow:
      #         https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      #         📄 Playwright Report:
      #         Download from workflow artifacts

      #         📊 Allure Report:
      #         Download from workflow artifacts