      - name: 📝 Generate PR Comment
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failure"
          fi

          if [ "${{ job.status }}" = "success" ]; then
            TITLE="✅ Playwright Validation Passed"
          else
            TITLE="❌ Playwright Validation Failed"
          fi

          if [ "${{ steps.slack_data.outputs.FAILED_MODULE_COUNT }}" = "0" ]; then

            FAILED_MODULE_SECTION="✅ No failed modules."

          else

            FAILED_MODULE_SECTION="
          ## ❌ Failed Modules

          ${{ steps.slack_data.outputs.FAILED_MODULES }}
          "

          fi

          if [ "${{ env.FAILED_TESTS }}" = "0" ]; then

            FAILURE_SECTION="✅ No failed tests detected."

          else

            FAILURE_SECTION="
          ## ❌ Failed Tests

          ${{ steps.slack_data.outputs.FAILED_TESTS }}
          "

          fi

          cat <<EOF > pr-comment.md
          <!-- playwright-validation-report -->

          # $TITLE

          ## 📋 Pull Request Details

          | Item | Value |
          |--------|--------|
          | PR Number | #${{ env.PR_NUMBER }} |
          | PR Title | ${{ env.PR_TITLE }} |
          | Link | ${{ env.PR_URL }} |
          | Author | ${{ env.PR_AUTHOR }} |
          | Source Branch | ${{ github.head_ref }} |
          | Target Branch | ${{ github.base_ref }} |
          | Label | ${{ env.PR_LABELS }} |
          | Status | $STATUS |

          ## 🚦 Validation Status

          | Status | Result |
          |----------|----------|
          | Build Status | ${{ env.BUILD_EMOJI }} |
          | Health | ${{ env.EXECUTION_HEALTH }} |
          | Duration | ${{ env.EXECUTION_DURATION }} |

          ## 📊 Execution Metrics

          | Metric | Value |
          |--------|--------|
          | Browser | Chromium |
          | Executed Tag | ${{ env.EXECUTED_TAG }} |
          | Duration | ${{ env.EXECUTION_DURATION }} |
          | Node Version | ${{ env.NODE_VERSION }} |
          | Playwright Version | ${{ env.PLAYWRIGHT_VERSION }} |

          ## 🧪 Test Results

          | Metric | Count |
          |--------|--------|
          | Passed | ${{ env.PASSED_TESTS }} |
          | Failed | ${{ env.FAILED_TESTS }} |
          | Skipped | ${{ env.SKIPPED_TESTS }} |
          | Flaky | ${{ env.FLAKY_TESTS }} |
          | Total | ${{ env.TOTAL_TESTS }} |

          ## ❌ Failed Modules

          ${{ steps.slack_data.outputs.FAILED_MODULES }}

          ## ❌ Failed Tests

          ${{ steps.slack_data.outputs.FAILED_TESTS }}

          ## 🔗 Reports

          - Playwright HTML Report
          - Allure Report

          🔗 Workflow:
          [Open Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          EOF

      - name: 💬 Create or Update PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body = fs.readFileSync('pr-comment.md', 'utf8');

            const marker = '<!-- playwright-validation-report -->';

            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number
              });

            const existingComment = comments.find(
              comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body
              });

              core.info('Updated existing PR comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });

              core.info('Created new PR comment');
            }