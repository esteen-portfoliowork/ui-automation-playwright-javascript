      - name: 📝 Generate PR Comment
        if: always() && github.event_name == 'pull_request'
        run: |
          cat <<EOF > pr-comment.md
          <!-- playwright-validation-report -->

          # 🎭 Playwright Execution Summary

          ## ${{ env.BUILD_EMOJI }} Pull Request Validation
          ${{ env.BUILD_TEXT }}

          ## 🚦 Execution Health
          ${{ env.EXECUTION_HEALTH }}
          Executed ${{ env.TOTAL_TESTS }} automated tests with a pass rate of ${{ env.PASS_RATE }}% in ${{ env.EXECUTION_DURATION }}.

          ## 📋 Execution Overview
          | Item | Value |
          |------|-------|
          | 🌐 Browser | ${{ env.BROWSER }} |
          | 🏷️ Executed Tag | ${{ env.EXECUTED_TAG }} |
          | 🌍 Environment | ${{ env.ENVIRONMENT }} |
          | 🎭 Playwright Version | ${{ env.PLAYWRIGHT_VERSION }} |
          | 📦 Node Version | ${{ env.NODE_VERSION }} |
          | 💻 Runner OS | ${{ env.RUNNER_OS_NAME }} |
          | ▶️ Start Time | ${{ env.START_DATE }} |
          | ⏹️ End Time | ${{ env.END_DATE }} |

          ### 📋 Pull Request Details
          | Item | Value |
          |--------|--------|
          | 🔢 PR Number | #${{ env.PR_NUMBER }} |
          | 📝 PR Title | ${{ env.PR_TITLE }} |
          | 🔗 PR URL | ${{ env.PR_URL }} |
          | 👤 Author | ${{ env.PR_AUTHOR }} |
          | 🌿 Source Branch | ${{ env.PR_BRANCH }} |
          | 🎯 Target Branch | ${{ env.PR_BASE_BRANCH }} |
          | 🏷️ Label | ${{ env.PR_LABELS }} |
          | 🔖 Commit SHA | ${{ env.PR_SHA }} |

          ## 📊 Execution Metrics
          | Metric | Value | % |
          |:----------:|:----------:|:----------:|
          | 🧪 Total Tests | ${{ env.TOTAL_TESTS }} | - |
          | ✅ Passed | ${{ env.PASSED_TESTS }} | ${{ env.PASS_RATE }}% |
          | ❌ Failed | ${{ env.FAILED_TESTS }} | ${{ env.FAILURE_RATE }}% |
          | ⚠️ Flaky | ${{ env.FLAKY_TESTS }} | ${{ env.FLAKY_RATE }}% |
          | ⏭️ Skipped | ${{ env.SKIPPED_TESTS }} | ${{ env.SKIPPED_RATE }}% |
          | 🏆 Quality Score | - | ${{ env.QUALITY_SCORE }}% |
          | ⏱️ Duration | ${{ env.EXECUTION_DURATION }} | - |

          ## 🌐 Application Health Dashboard
          $(cat application-health-dashboard.md)

          ## 📦 Module Breakdown
          $(cat module-breakdown.md)

          ## 🏷️ Tag Execution Summary
          $(cat tag-execution-summary.md)

          ## 🏆 Top Risk Module
          $(cat top-risk-modules.md)

          ## ❌ Failed Modules
          $(cat failed-modules.md)

          ## ❌ Failed Tests
          $(cat failed-tests.md)

          ## ⚠️ Flaky Tests
          $(cat flaky-tests.md)

          ## ⏱️ Slowest Module
          $(cat slowest-module.md)

          ## 🔗 Report Links
          $(cat report-links.md)

      - name: 💬 Create or Update PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body = fs.readFileSync('pr-comment.md', 'utf8');

            const marker = '<!-- playwright-validation-report -->';

            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number
              });

            const existingComment = comments.find(
              comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body
              });

              core.info('Updated existing PR comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });

              core.info('Created new PR comment');
            }